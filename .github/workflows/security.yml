name: Security

# All security checks in one place: production dependency audit, secret
# hygiene, and CodeQL static analysis (SAST). Runs on push/PR plus a weekly
# scheduled scan so newly-disclosed issues catch existing code too.
on:
  push:
    branches: [main, dev-beta]
  pull_request:
    branches: [main, dev-beta]
  schedule:
    - cron: '27 3 * * 1' # Mondays 03:27 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit (prod, fail on high+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backends/node/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        # Fails on any high/critical prod advisory except documented
        # false-positives allowlisted in scripts/audit-check.mjs.
        run: node scripts/audit-check.mjs

  secrets:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No tracked secret files or committed private keys
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(\.env|config\.js)$'; then
            echo "::error::A secret file (.env / config.js) is tracked — it must stay gitignored"
            exit 1
          fi
          if git grep -nI -E 'BEGIN ([A-Z ]+ )?PRIVATE KEY' -- . ; then
            echo "::error::A private key appears to be committed"
            exit 1
          fi
          echo "OK: no tracked .env/config.js, no committed private keys"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          # JS/TS and Python are interpreted — no compile step needed.
          build-mode: none
          # security-extended (not security-and-quality): keep the full
          # security query set but drop the code-quality queries (unused
          # vars, useless assignments, etc.) — this is a security gate, not
          # a linter, and those were ~130 alerts of noise.
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
