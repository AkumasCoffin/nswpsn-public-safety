  <style>
    /* Tokens mirror staff.html so the page looks native to the admin/site. */
    :root {
      --bg-dark: #060a15;
      --bg-card: #0e1728;
      --bg-card-2: #121e33;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #f1f5f9;
      --text-soft: #94a3b8;
      --brand: #f97316;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --accent-border: rgba(56, 189, 248, 0.35);
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(900px 480px at 85% -10%, rgba(56, 189, 248, 0.06), transparent 60%),
        radial-gradient(700px 420px at -10% 0%, rgba(249, 115, 22, 0.05), transparent 55%),
        var(--bg-dark);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
    }

    ::selection { background: rgba(56, 189, 248, 0.3); }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }

    /* Header — sticky glassy topbar (mirrors staff.html). */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin: 0 -2rem 1.75rem;
      padding: 1rem 2rem;
      background: rgba(6, 10, 21, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
    .header h1 span { color: var(--brand); }
    .header-actions { display: flex; gap: 0.6rem; align-items: center; flex-shrink: 0; }

    .btn {
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: rgba(148, 163, 184, 0.35); }
    .btn-danger { background: rgba(239, 68, 68, 0.13); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.26); color: #fca5a5; }

    /* Big platform download buttons. */
    .dl-row { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.25rem 0 0.5rem; }
    .dl-btn {
      flex: 1 1 220px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 1.1rem 1.4rem;
      border-radius: 12px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: #bae6fd;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .dl-btn i { font-size: 1.4rem; }
    .dl-btn:hover:not(:disabled) { background: rgba(56, 189, 248, 0.25); color: #e0f2fe; }
    .dl-btn:active { transform: translateY(1px); }
    .dl-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 55%),
        var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }
    .card-head .icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.14);
      color: var(--success);
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .card-head h2 { font-size: 1.2rem; font-weight: 700; }
    .card-sub { color: var(--text-soft); font-size: 0.9rem; line-height: 1.5; }

    .steps {
      display: flex; gap: 0.6rem; flex-wrap: wrap;
      margin: 1.1rem 0 0.4rem;
    }
    .step {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .step b { color: var(--accent); }

    .note {
      margin-top: 1rem;
      font-size: 0.82rem;
      color: var(--text-soft);
      line-height: 1.6;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
    }
    .note i { color: var(--warning); margin-right: 0.35rem; }
    .note a { color: var(--accent); text-decoration: none; }
    .note a:hover { text-decoration: underline; }

    .token-line {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--text-soft);
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .token-line code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.5rem;
      border-radius: 5px;
      color: #7dd3fc;
    }

    /* Platform (Windows / Linux) download cards. */
    .plat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.35rem 0 0.5rem;
    }
    .plat {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.15rem 1.2rem 1.25rem;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 60%),
        var(--bg-card-2);
    }
    .plat-head { display: flex; align-items: baseline; gap: 0.55rem; }
    .plat-head i { font-size: 1.2rem; color: var(--accent); position: relative; top: 2px; }
    .plat-head h3 { font-size: 1.05rem; font-weight: 700; }
    .plat-head .plat-tag { margin-left: auto; font-size: 0.72rem; color: var(--text-soft); }
    .plat .dl-btn { width: 100%; margin: 1rem 0 0; }
    .plat ol {
      list-style: none;
      counter-reset: step;
      margin: 1rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .plat ol li {
      counter-increment: step;
      position: relative;
      padding-left: 2rem;
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-primary);
    }
    .plat ol li::before {
      content: counter(step);
      position: absolute;
      left: 0; top: 0.05rem;
      width: 1.4rem; height: 1.4rem;
      border-radius: 50%;
      background: var(--accent-soft);
      color: #7dd3fc;
      border: 1px solid var(--accent-border);
      font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .plat ol li b { color: var(--accent); font-weight: 600; }
    .cmd {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.5rem;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0.4rem 0.5rem 0.4rem 0.6rem;
    }
    .cmd code {
      flex: 1; min-width: 0;
      overflow-x: auto; white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; color: #7dd3fc;
    }
    .cmd button {
      flex-shrink: 0;
      background: transparent; border: none;
      color: var(--text-soft); cursor: pointer;
      font-size: 0.85rem; padding: 0.15rem 0.3rem; border-radius: 5px;
      transition: color 0.15s ease;
    }
    .cmd button:hover { color: var(--accent); }
    .plat .note { margin-top: 0.9rem; }

    /* Section header inside a card. */
    .section-h {
      display: flex; align-items: center; gap: 0.75rem;
      color: var(--text-soft);
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      margin: 1.75rem 0 1rem; font-weight: 600;
    }
    .section-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-subtle), transparent); }

    /* Node list rows. */
    .node-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .node-row {
      display: flex; align-items: flex-start; gap: 0.85rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.85rem 1rem;
    }
    .node-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-soft); opacity: 0.5; flex-shrink: 0; margin-top: 0.35rem; }
    .node-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(34, 197, 94, 0.55); opacity: 1; }
    .node-meta { flex: 1; min-width: 0; }
    .node-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-sub { color: var(--text-soft); font-size: 0.78rem; margin-top: 0.15rem; }
    .node-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.45rem; }
    .node-chip {
      font-size: 0.7rem; font-weight: 600; padding: 0.14rem 0.55rem; border-radius: 999px;
      border: 1px solid var(--border-subtle); color: var(--text-soft);
      background: rgba(255, 255, 255, 0.03); white-space: nowrap;
    }
    .node-chip.ok { color: #86efac; border-color: rgba(34, 197, 94, 0.45); background: rgba(34, 197, 94, 0.13); }
    .node-chip.warn { color: #fcd34d; border-color: rgba(234, 179, 8, 0.45); background: rgba(234, 179, 8, 0.13); }
    .node-chip.off { opacity: 0.6; }
    .node-chip.updating { color: #c084fc; border-color: rgba(168, 85, 247, 0.45); background: rgba(168, 85, 247, 0.14); }
    .node-dot.updating { background: #a855f7; box-shadow: 0 0 8px rgba(168, 85, 247, 0.6); opacity: 1; animation: nodePulse 1.2s ease-in-out infinite; }
    @keyframes nodePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .node-stat { font-size: 0.78rem; color: var(--text-soft); margin-top: 0.45rem; }
    .node-stat b { color: var(--text-primary); font-weight: 700; }
    /* Card header: name (+ kind) on the left, agent version chip on the right. */
    .node-head { display: flex; align-items: center; gap: 0.5rem; }
    .node-head .node-name { flex: 1; }
    .node-sub .st-on { color: #86efac; font-weight: 600; }
    .node-sub .st-off { color: var(--text-soft); font-weight: 600; }
    /* Uptime is coloured only when it is worth noticing: a healthy figure
       should not compete with the status word beside it. */
    .node-uptime { font-weight: 600; }
    .node-uptime.ok { color: #86efac; }
    .node-uptime.warn { color: #fbbf24; }
    .node-sub .st-upd { color: #c084fc; font-weight: 600; }
    /* Location / key meta line — icon+label items, comfortably spaced + wrapping. */
    .node-loc { display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; margin-top: 0.3rem; font-size: 0.75rem; color: var(--text-soft); }
    .node-loc .nl-item { display: inline-flex; align-items: center; gap: 0.3rem; }
    .node-loc .nl-item i { opacity: 0.7; }
    .node-loc .nl-warn { color: #fbbf24; }
    .node-loc .nl-key code { background: rgba(255,255,255,0.06); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 0.02rem 0.32rem; font-size: 0.7rem; color: var(--text-soft); }
    /* Recent-messages modal (owner view of decoded pager pages). */
    .msg-modal { max-width: 700px; }
    .msg-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .msg-head h3 { margin: 0; }
    .msg-sub { font-size: 0.75rem; color: var(--text-soft); margin: 0.35rem 0 0.7rem; }
    .msg-list { max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 0.3rem; }
    .msg-row { display: grid; grid-template-columns: auto 1fr auto; gap: 0.6rem; align-items: baseline;
      padding: 0.42rem 0.6rem; border-radius: 8px; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-subtle); font-size: 0.82rem; }
    .msg-row.msg-filtered { opacity: 0.5; }
    .msg-time { color: var(--text-soft); font-size: 0.72rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .msg-body { min-width: 0; word-break: break-word; line-height: 1.4; }
    .msg-addr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #7dd3fc; }
    .msg-src { color: var(--text-soft); font-size: 0.72rem; white-space: nowrap; }
    .msg-badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
      color: #fcd34d; background: rgba(234,179,8,0.14); border: 1px solid rgba(234,179,8,0.4);
      padding: 0.02rem 0.32rem; border-radius: 4px; margin-right: 0.25rem; }
    .msg-empty { color: var(--text-soft); text-align: center; padding: 1.6rem 1rem; font-size: 0.85rem; }
    /* Per-node activity & stats modal (radio nodes). */
    /* Higher specificity than the base `.modal` (which sets max-width:520px and
       is defined later in source) so this wins regardless of source order. */
    .modal.fs-modal { max-width: 940px; width: 100%; }
    .fs-wins { display: flex; gap: 0.35rem; margin: 0.2rem 0 0.9rem; }
    .fs-win {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
      color: var(--text-soft); border-radius: 999px; padding: 0.25rem 0.75rem;
      font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.15s ease;
    }
    .fs-win:hover { color: var(--text-primary); }
    .fs-win.active { background: var(--accent-soft); border-color: var(--accent-border); color: #7dd3fc; font-weight: 600; }
    .fs-tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
    .fs-tile { background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 0.6rem 0.4rem; text-align: center; }
    .fs-tile-v { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .fs-tile-l { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); margin-top: 0.15rem; }
    .fs-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; margin-bottom: 0.6rem; }
    .fs-col { background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: 9px; padding: 0.55rem 0.6rem; min-width: 0; }
    .fs-col-h { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); margin-bottom: 0.4rem; font-weight: 600; }
    .fs-li { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; font-size: 0.8rem; padding: 0.15rem 0; min-width: 0; }
    .fs-li-n { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    /* Talkgroup alias colour, so a contributor picks out their own talkgroups
       at a glance — same cue the staff Data page uses. */
    .fs-dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; margin-right: .35rem; vertical-align: middle; }
    /* Owning agency, from the SDR-Trunk alias group. Secondary to the name:
       it answers "whose talkgroup is this", not "which talkgroup". */
    .fs-ag { font-size: 0.62rem; padding: .05rem .3rem; border-radius: 4px; background: rgba(148,163,184,0.14); color: var(--text-soft); margin-left: .3rem; }
    .fs-li-c { color: var(--accent); font-variant-numeric: tabular-nums; flex-shrink: 0; font-size: 0.75rem; }
    .fs-li-empty { color: var(--text-soft); }
    .fs-act-h { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); margin: 0.9rem 0 0.45rem; font-weight: 600; }
    .fs-act { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 0.2rem; }
    .fs-arow {
      display: grid; grid-template-columns: 4.5rem minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.2fr) 2.5rem;
      gap: 0.75rem; align-items: baseline; padding: 0.4rem 0.7rem; border-radius: 7px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); font-size: 0.82rem;
    }
    .fs-atime { color: var(--text-soft); font-size: 0.7rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .fs-atg { color: var(--text-primary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fs-aun, .fs-asite { color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fs-aun i, .fs-asite i { opacity: 0.6; font-size: 0.72rem; }
    .fs-arx { text-align: right; }
    .fs-rx { color: var(--text-soft); font-size: 0.7rem; font-variant-numeric: tabular-nums; }

    /* ---- ADS-B receiver activity (showAdsbStats) ---- */
    .ab-polar-wrap { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
      margin-bottom: 0.9rem; }
    .ab-polar-legend { font-size: 0.72rem; color: var(--text-soft); line-height: 1.7; }
    .ab-polar-key { display: inline-block; width: 14px; height: 0; margin-right: 6px;
      vertical-align: middle; border-top-width: 2px; border-top-style: solid; }
    .ab-map { height: 320px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); }
    .ab-note { font-size: 0.7rem; color: var(--text-soft); margin: 0.4rem 0 0.9rem; }
    .ab-scroll { max-height: 34vh; overflow-y: auto; }
    .ab-tbl { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .ab-tbl th { text-align: left; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-soft); font-weight: 600; padding: 0.3rem 0.5rem; position: sticky; top: 0;
      background: var(--bg-elevated, #0f172a); z-index: 1; }
    .ab-tbl td { padding: 0.3rem 0.5rem; border-top: 1px solid var(--border-subtle); vertical-align: top; }
    .ab-tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
    .ab-hex { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #7dd3fc; }
    .ab-soft { color: var(--text-soft); }
    .ab-detail { color: var(--text-soft); font-size: 0.7rem; }
    .fs-enc { color: #fcd34d; background: rgba(234,179,8,0.14); border: 1px solid rgba(234,179,8,0.4);
      font-size: 0.58rem; font-weight: 700; padding: 0.02rem 0.28rem; border-radius: 4px; margin-right: 0.35rem; vertical-align: middle; }
    @media (max-width: 640px) {
      .fs-tiles { grid-template-columns: repeat(3, 1fr); }
      .fs-cols { grid-template-columns: 1fr; }
      .fs-arow { grid-template-columns: 3.6rem minmax(0, 1fr) 1.8rem; }
      .fs-aun, .fs-asite { display: none; }
    }
    /* Add-node form */
    .add-node { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.25rem 0 0.5rem; }
    .add-node input, .add-node select {
      flex: 1; min-width: 160px; background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 0.55rem 0.7rem; font-family: inherit; font-size: 0.85rem;
    }
    .add-node .dl-btn { width: auto; margin: 0; white-space: nowrap; }
    .add-node-hint { font-size: 0.75rem; color: var(--text-soft); margin: 0 0 0.5rem; }
    /* Per-node bits */
    .node-kind {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: #7dd3fc; background: rgba(56,189,248,0.14); border: 1px solid rgba(56,189,248,0.35);
      padding: 0.05rem 0.4rem; border-radius: 5px; vertical-align: middle; margin-left: 0.35rem;
    }
    .node-sub code { color: var(--text-primary); }
    .node-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
    .mini-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); border-radius: 7px;
      color: var(--text-soft); padding: 0.32rem 0.55rem; font-size: 0.78rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .mini-btn:hover { color: var(--text-primary); border-color: var(--accent-border, #38bdf8); }
    .mini-btn.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.5); }
    /* One-time token modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
      align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
      overflow-y: auto; }
    .modal { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px;
      padding: 1.4rem; max-width: 520px; width: 100%;
      /* Capped and scrollable. Without this a tall modal — the ADS-B receiver
         view is tiles, two tables, a coverage plot AND a map — overflowed a
         centred flex container in both directions, and everything below the
         fold was simply unreachable. */
      max-height: calc(100vh - 2rem); overflow-y: auto; }
    .modal h3 { margin: 0 0 0.6rem; }
    .modal p { color: var(--text-soft); font-size: 0.85rem; margin: 0 0 0.8rem; }
    .modal h3 .req {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: #fcd34d; background: rgba(234,179,8,0.14); border: 1px solid rgba(234,179,8,0.4);
      padding: 0.08rem 0.4rem; border-radius: 5px; vertical-align: middle; margin-left: 0.4rem;
    }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .modal-actions .dl-btn { width: auto; margin: 0; }
    /* Per-platform download + its run instructions in the install modal. */
    .dl-list { display: flex; flex-direction: column; gap: 0.7rem; margin: 0.6rem 0 0.9rem; }
    .dl-block { display: flex; flex-direction: column; gap: 0.3rem; }
    /* Compact download buttons in the list (the base .dl-btn is a big CTA). */
    .dl-block .dl-btn { flex: 0 0 auto; width: auto; align-self: flex-start; margin: 0; padding: 0.45rem 0.85rem; font-size: 0.84rem; border-radius: 8px; gap: 0.5rem; }
    .dl-block .dl-btn i { font-size: 0.95rem; }
    .dl-run { font-size: 0.8rem; color: var(--text-soft); line-height: 1.5; }
    .dl-run code { background: rgba(255,255,255,0.06); border: 1px solid var(--border-subtle); border-radius: 5px; padding: 0.1rem 0.4rem; font-size: 0.76rem; color: var(--text-primary); user-select: all; }
    .dl-btn.danger { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.45); color: #fca5a5; }
    .dl-btn.danger:hover:not(:disabled) { background: rgba(239,68,68,0.25); color: #fecaca; }
    .loc-modal { max-width: 620px; }
    .loc-field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.9rem; }
    .loc-field > span { font-size: 0.85rem; font-weight: 600; color: var(--text-soft, #94a3b8); }
    /* Match the node-kind picker (.add-node select) so it fits the rest of the page. */
    .loc-field select {
      width: 100%; background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 0.55rem 0.7rem; font-family: inherit; font-size: 0.9rem;
    }
    /* The native option popup ignores translucent/inherited colours on most
       browsers, so give the options + group labels a solid dark bg + light text
       (otherwise the zone names render unreadable). */
    .loc-field select option { background: #0f172a; color: var(--text-primary); }
    .loc-field select optgroup { background: #0f172a; color: #7dd3fc; font-weight: 700; }
    .loc-field .lga-combo input {
      width: 100%; background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 0.55rem 0.7rem; font-family: inherit; font-size: 0.9rem;
    }
    /* Custom LGA dropdown — the native <datalist> popup is unstylable (it
       renders as a giant white list pinned to the screen edge), so suggestions
       live in our own positioned, filter-as-you-type list under the field. */
    .lga-combo { position: relative; display: block; }
    .lga-dd { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 1200;
      max-height: 230px; overflow-y: auto; background: #0f172a;
      border: 1px solid var(--border-subtle, #334155); border-radius: 8px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.5); display: none; }
    .lga-dd.open { display: block; }
    .lga-dd .lga-opt { padding: 0.45rem 0.7rem; cursor: pointer; font-size: 0.85rem; color: var(--text-primary, #e2e8f0); }
    .lga-dd .lga-opt:hover { background: rgba(125,211,252,0.12); }
    .loc-pin-toggle { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.9rem; font-size: 0.9rem; cursor: pointer; }
    /* ADS-B: the pin is required, so it gets a field label rather than a
       checkbox the volunteer could untick. */
    .loc-pin-required { margin-bottom: 0.6rem; font-size: 0.9rem; font-weight: 600; }
    .loc-pin-toggle input { width: 16px; height: 16px; flex: 0 0 auto; }
    #loc-map { height: 340px; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--border-subtle); }
    #loc-map, #loc-map * { box-sizing: initial; } /* Leaflet needs its own box model */
    .leaflet-container { background: #0b1220; }
    .ab-cov-btn {
      float: right; cursor: pointer; font-family: inherit;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em;
      text-transform: none; padding: 0.2rem 0.55rem; border-radius: 999px;
      color: #cbd5e1; background: rgba(148,163,184,0.12);
      border: 1px solid rgba(148,163,184,0.3);
    }
    .ab-cov-btn:hover { background: rgba(148,163,184,0.22); }
    .ab-cov-btn.on {
      color: #e9d5ff; background: rgba(192,132,252,0.22);
      border-color: rgba(192,132,252,0.55);
    }
    /* Clicking a track drew a huge rectangle over the map: the browser's focus
       ring follows an SVG path's BOUNDING BOX, and a track crossing the frame
       diagonally has a bounding box the size of the frame. The paths only
       became focusable at all because they were made interactive to answer a
       hover.

       Suppressed for pointer focus only — :focus-visible still shows the ring
       for anyone tabbing, who has no other way to tell what is selected. */
    .leaflet-container path.leaflet-interactive:focus:not(:focus-visible) { outline: none; }
    .node-ver {
      font-size: 0.72rem; color: #7dd3fc;
      background: var(--accent-soft);
      padding: 0.16rem 0.5rem; border-radius: 5px; white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--text-soft);
      background: var(--bg-card);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
    }
    .empty-state i { font-size: 2.2rem; margin-bottom: 0.85rem; opacity: 0.4; display: block; }

    .loading { display: flex; align-items: center; justify-content: center; padding: 4rem; }
    .loading i { font-size: 1.8rem; color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toasts (mirrors staff.html). */
    #toast-stack {
      position: fixed; bottom: 1.25rem; right: 1.25rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      z-index: 3000; pointer-events: none;
    }
    .toast {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg-card-2);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--text-primary);
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.6);
      max-width: 340px;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.success i { color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.error i { color: var(--danger); }
    .toast.fade-out { opacity: 0; transition: opacity 0.3s ease; }

    @media (max-width: 768px) {
      .container { padding: 1rem 1rem 2rem; }
      .header { margin: 0 -1rem 1.25rem; padding: 0.85rem 1rem; flex-wrap: wrap; }
      .card { padding: 1.2rem 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Radio <span>Feeder</span></h1>
      <div class="header-actions">
        <a href="map" class="btn btn-secondary"><i class="fas fa-map"></i> Map</a>
        <button class="btn btn-danger" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <!-- Feeder cards live in this container. Phase 1 ships the radio card;
         aircraft / pager feeder cards can be appended here later as their
         backend endpoints land — each is a self-contained .card. -->
    <div id="feeder-cards">
      <div class="loading"><i class="fas fa-spinner"></i></div>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let _pollTimer = null;
    const _pollIntervalMs = 15_000;

    function escapeHtml(value) {
      if (value == null) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, kind = 'success', ms = 3500) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle' };
      const el = document.createElement('div');
      el.className = `toast ${kind}`;
      el.innerHTML = `<i class="fas ${icons[kind] || icons.success}"></i><span></span>`;
      el.querySelector('span').textContent = message;
      stack.appendChild(el);
      setTimeout(() => { el.classList.add('fade-out'); setTimeout(() => el.remove(), 350); }, ms);
    }

    // In-page confirm dialog — replaces the browser's native confirm(). Returns
    // a Promise<boolean>. Pass a string or { title, message, confirmLabel,
    // cancelLabel, danger }.
    function confirmDialog(opts) {
      const o = typeof opts === 'string' ? { message: opts } : (opts || {});
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal">
            <h3><i class="fas ${o.danger ? 'fa-triangle-exclamation' : 'fa-circle-question'}"></i> ${escapeHtml(o.title || 'Please confirm')}</h3>
            <p></p>
            <div class="modal-actions">
              <button class="dl-btn ${o.danger ? 'danger' : ''}" data-act="ok"><i class="fas fa-check"></i> ${escapeHtml(o.confirmLabel || 'Confirm')}</button>
              <button class="mini-btn" data-act="cancel">${escapeHtml(o.cancelLabel || 'Cancel')}</button>
            </div>
          </div>`;
        overlay.querySelector('p').textContent = o.message || '';
        const done = (val) => { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(val); };
        const onKey = (e) => { if (e.key === 'Escape') done(false); else if (e.key === 'Enter') done(true); };
        overlay.addEventListener('click', (e) => { if (e.target === overlay) done(false); });
        overlay.querySelector('[data-act="ok"]').addEventListener('click', () => done(true));
        overlay.querySelector('[data-act="cancel"]').addEventListener('click', () => done(false));
        document.body.appendChild(overlay);
        document.addEventListener('keydown', onKey);
        setTimeout(() => { const b = overlay.querySelector('[data-act="ok"]'); if (b) b.focus(); }, 30);
      });
    }

    function fmtLastSeen(value) {
      if (value == null || value === '') return 'never';
      let d;
      if (typeof value === 'number') d = new Date(value < 1e12 ? value * 1000 : value);
      else {
        const n = Number(value);
        d = (!Number.isNaN(n) && String(value).trim() !== '')
          ? new Date(n < 1e12 ? n * 1000 : n)
          : new Date(value);
      }
      if (Number.isNaN(d.getTime())) return 'unknown';
      const secs = Math.round((Date.now() - d.getTime()) / 1000);
      if (secs < 0) return 'just now';
      if (secs < 60) return `${secs}s ago`;
      if (secs < 3600) return `${Math.round(secs / 60)}m ago`;
      if (secs < 86400) return `${Math.round(secs / 3600)}h ago`;
      return d.toLocaleDateString();
    }

    // Current Supabase access token — required as a Bearer for every
    // /api/feeder call (the endpoints gate on the JWT, not the API_KEY).
    async function getToken() {
      const { data } = await sb.auth.getSession();
      return data?.session?.access_token || null;
    }

    async function doLogout() {
      if (typeof umami !== 'undefined') umami.track('logout');
      await sb.auth.signOut();
      window.location.href = 'login';
    }

    // --- Boot: require a session, else bounce to the login page (keeping a
    // ?redirect= back here, exactly like the rest of the site). ---
    async function boot() {
      const { data } = await sb.auth.getSession();
      if (!data.session) {
        window.location.href = 'login?redirect=' + encodeURIComponent('/feeder');
        return;
      }
      await loadFeeder();
    }

    async function loadFeeder() {
      const container = document.getElementById('feeder-cards');
      try {
        const token = await getToken();
        if (!token) {
          window.location.href = 'login?redirect=' + encodeURIComponent('/feeder');
          return;
        }
        const res = await fetch(`${API_BASE_URL}/api/feeder/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 403) { stopPolling(); renderNotContributor(); return; }
        if (res.status === 503) { stopPolling(); renderNotConfigured(); return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        renderRadioCard(data);
        startPolling();
      } catch (e) {
        console.error('Error loading feeder:', e);
        stopPolling();
        if (container) container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-triangle-exclamation"></i>
            <p>Couldn't load your feeder details.<br><span style="font-size:0.8rem;">${escapeHtml(e.message)}</span></p>
            <button class="btn btn-secondary" style="margin-top:1rem;" onclick="loadFeeder()"><i class="fas fa-sync-alt"></i> Retry</button>
          </div>`;
      }
    }

    function renderNotContributor() {
      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon" style="background: rgba(148,163,184,0.14); color: var(--text-soft);"><i class="fas fa-lock"></i></div>
            <h2>You're not set up as a radio feeder yet</h2>
          </div>
          <p class="card-sub">
            Radio feeding is invite-based. If you'd like to run a feeder node and contribute
            scanner audio, request access below and a staff member will set you up.
          </p>
          <div class="dl-row">
            <a class="dl-btn" href="signup" style="text-decoration:none;">
              <i class="fas fa-user-plus"></i> Request feeder access
            </a>
          </div>
          <p class="card-sub" style="margin-top:0.75rem;">
            Already asked? It may still be pending — or reach out to staff on
            <a href="https://discord.forcequit.xyz" target="_blank" style="color:var(--accent);text-decoration:none;">Discord</a>.
          </p>
        </div>`;
    }

    function renderNotConfigured() {
      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon" style="background: rgba(245,158,11,0.14); color: var(--warning);"><i class="fas fa-screwdriver-wrench"></i></div>
            <h2>Feeder system not configured yet</h2>
          </div>
          <p class="card-sub">The radio feeder backend isn't switched on for this deployment yet — check back soon.</p>
        </div>`;
    }

    // Plaintext node tokens are shown ONCE and never stored server-side; keep the
    // ones minted this session in memory so a fresh install can be downloaded
    // right after create/rotate. Lost on reload → re-download rotates for a new key.
    const _nodeTokens = {};
    let _feederNodes = [];
    const _kindLabel = { radio: 'PSN', pager: 'Pager', adsb: 'ADSB' };
    // Kinds with a real agent + installer today, and the platforms each supports.
    const _kindAgent = {
      radio: { platforms: ['windows', 'linux'] },
      pager: { platforms: ['linux'] }, // rtl_fm | multimon-ng is a Linux stack
      adsb: { platforms: ['linux'] },  // dump1090 + a bash launcher, likewise
    };
    const hasAgent = (kind) => !!_kindAgent[kind];
    const _loc = { map: null, marker: null, thenInstall: false, node: null, nodeId: null, createKind: null, pinPlaced: false };

    // RFS zone list (grouped by Area Command) for the location picker dropdown.
    let _zoneGroups = null;
    async function loadZones() {
      if (_zoneGroups) return _zoneGroups;
      try {
        const jwt = await getToken();
        const res = await fetch(`${API_BASE_URL}/api/feeder/zones`, {
          headers: jwt ? { 'Authorization': 'Bearer ' + jwt } : {},
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const groups = Array.isArray(data.groups) ? data.groups : [];
        // Only CACHE a non-empty list so a transient failure retries on the next
        // open instead of sticking the picker with an empty dropdown.
        if (groups.length) _zoneGroups = groups;
        return groups;
      } catch (e) { return []; }
    }
    function _zoneOptionsHtml(selected) {
      let out = `<option value="" ${selected ? '' : 'selected'} disabled>Select your region…</option>`;
      for (const g of (_zoneGroups || [])) {
        out += `<optgroup label="${escapeHtml(g.areaCommand)}">`;
        for (const z of (g.zones || [])) {
          out += `<option value="${escapeHtml(z.name)}" ${z.name === selected ? 'selected' : ''}>${escapeHtml(z.name)}</option>`;
        }
        out += `</optgroup>`;
      }
      return out;
    }

    // Australian states for PAGER node location (radio nodes use the RFS zone).
    const AU_STATES = ['NSW', 'VIC', 'QLD', 'SA', 'WA', 'TAS', 'NT', 'ACT'];
    function _stateOptionsHtml(selected) {
      return `<option value="" ${selected ? '' : 'selected'} disabled>Select your state…</option>`
        + AU_STATES.map(s => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('');
    }
    // ABS LGA names per state (same source as signup) for the LGA dropdown.
    // Cached per state; a failed fetch degrades to free text, never a blocked
    // form. keepValue preserves the stored LGA on the initial (edit) fill.
    // Suggestions render in our own styled .lga-dd list (see _lgaShow) — the
    // native <datalist> popup can't be styled to match the site.
    const _lgaNamesCache = {};
    let _lgaNames = [];
    async function _locOnStateChange(keepValue) {
      const state = document.getElementById('loc-state')?.value || '';
      const lga = document.getElementById('loc-lga');
      if (!lga) return;
      if (!keepValue) lga.value = '';
      lga.disabled = !state;
      lga.placeholder = state ? 'Start typing your council area…' : 'Select your state first…';
      _lgaNames = [];
      _lgaHide();
      if (!state) return;
      if (_lgaNamesCache[state]) { _lgaNames = _lgaNamesCache[state]; return; }
      try {
        const res = await fetch(`${API_BASE_URL}/api/boundaries/lga-names?state=${state}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const names = Array.isArray(data.names) ? data.names : [];
        _lgaNamesCache[state] = names;
        // The user may have changed state while this was in flight.
        if ((document.getElementById('loc-state')?.value || '') === state) _lgaNames = names;
      } catch (e) { /* no suggestions is fine — the field is free text either way */ }
    }
    function _lgaShow() {
      const input = document.getElementById('loc-lga');
      const dd = document.getElementById('loc-lga-dd');
      if (!input || !dd || input.disabled) return;
      const q = input.value.trim().toLowerCase();
      const matches = _lgaNames.filter(n => n.toLowerCase().includes(q));
      dd.innerHTML = matches.map(n => `<div class="lga-opt" data-lga="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join('');
      dd.classList.toggle('open', matches.length > 0);
    }
    function _lgaHide() {
      const dd = document.getElementById('loc-lga-dd');
      if (dd) dd.classList.remove('open');
    }

    function renderRadioCard(data) {
      const nodes = data.nodes || [];
      _feederNodes = nodes;
      // Which node kinds this user may create (by role). Each kind has its own
      // feeder:<kind> role, so adsb no longer piggybacks on radio. Default
      // permissive for radio/pager if an older backend does not send the field;
      // adsb defaults OFF, since a backend that predates the role would reject
      // the create anyway and offering it would just produce a 403.
      const cc = data.canCreate || { radio: true, pager: true, adsb: false };
      const opts = [];
      if (cc.radio) opts.push('<option value="radio">PSN</option>');
      if (cc.pager) opts.push('<option value="pager">Pager</option>');
      if (cc.adsb) opts.push('<option value="adsb">ADSB</option>');
      const addNodeHtml = opts.length
        ? `<div class="add-node">
             <select id="new-node-kind" aria-label="Node type">${opts.join('')}</select>
             <button class="dl-btn" onclick="addNode(this)"><i class="fas fa-plus"></i> Add node</button>
           </div>
           <p class="add-node-hint">Nodes are named automatically. Pick a type and add.</p>`
        : `<p class="add-node-hint">Your account doesn't have a contributor role that can create nodes.</p>`;
      const nodesHtml = nodes.length
        ? `<div class="node-list">${nodes.map(_nodeRow).join('')}</div>`
        : `<div class="empty-state">
             <i class="fas fa-satellite-dish"></i>
             <p>No nodes yet — add one below to get its installer.</p>
           </div>`;

      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon"><i class="fas fa-satellite-dish"></i></div>
            <h2>Your feeder nodes</h2>
          </div>
          <p class="card-sub">
            Each node has its own key. Add a node, download its installer (key baked in), and run it.
            Deleting or re-issuing a node's key cuts off just that one node — nothing else.
          </p>

          ${addNodeHtml}

          <div class="section-h">Nodes</div>
          <div id="nodes-region">${nodesHtml}</div>
        </div>`;
    }

    function _nodeRow(node) {
      const online = !!node.online;
      const updating = !!node.updating;
      const name = node.name || 'Unnamed node';
      const lastSeen = fmtLastSeen(node.lastSeenAt);

      // Uptime over the last seven days, plus how long this run has lasted.
      // Both come from the same stored record of which MINUTES the node was
      // heard in, so neither resets when the backend is redeployed — an uptime
      // that restarts whenever WE restart is measuring the wrong machine.
      const up = node.uptime;
      const fmtRun = (ms) => {
        if (ms == null) return null;
        const m = Math.floor(ms / 60000);
        if (m < 60) return m + 'm';
        const h = Math.floor(m / 60);
        if (h < 24) return h + 'h ' + (m % 60) + 'm';
        return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
      };
      let uptimeHtml = '';
      if (up && up.pct !== null) {
        const pct = up.pct * 100;
        // One decimal below 99.95%, so a node that is very nearly perfect is
        // not rounded into claiming it was.
        const shown = pct >= 99.95 ? '100' : pct.toFixed(1);
        const cls = pct >= 99 ? 'ok' : pct >= 95 ? '' : 'warn';
        const run = fmtRun(up.currentRunMs);
        uptimeHtml = ` · <span class="node-uptime ${cls}" title="Seen in ${up.minutesUp} of the last ${up.minutesWindow} minutes">`
          + `${shown}% uptime (7d)</span>`
          + (run ? ` · up ${escapeHtml(run)}` : '');
      }
      const kind = node.kind || 'radio';
      const isRadio = kind === 'radio';
      const isPager = kind === 'pager';
      const isAdsb = kind === 'adsb';
      const agentCfg = _kindAgent[kind];
      const agent = node.agentVersion;
      const agentHtml = agent ? `<span class="node-ver">agent ${escapeHtml(agent)}</span>` : '';
      // Pager: which frequencies are decoding right now (RFS / FR / both).
      const freqShort = (l) => { const u = String(l).toUpperCase(); return (u === 'NSWRFS' || u === 'RFS') ? 'RFS' : (u === 'FRNSW' || u === 'FR') ? 'FR' : l; };
      const decodedLabels = Array.isArray(node.pagerDecoding) ? node.pagerDecoding.map(freqShort) : [];

      const chip = (cls, label) => `<span class="node-chip ${cls}">${escapeHtml(label)}</span>`;
      const chipHtml = (cls, html) => `<span class="node-chip ${cls}">${html}</span>`;
      let chips;
      if (!agentCfg) {
        chips = chip('', 'agent coming soon');
      } else if (updating) {
        chips = chipHtml('updating', '<i class="fas fa-arrows-rotate"></i> Updating');
      } else if (!online) {
        chips = chip('off', 'Offline');
      } else if (isAdsb) {
        let out = '';
        if (!node.sdrUp) out += chip('warn', 'Decoder down');
        else if (node.decoding) out += chip('ok', 'Decoding');
        else out += chip('', 'Idle');
        // What the receiver is actually contributing. Aircraft can legitimately
        // be zero on a quiet night, so it is shown as a plain count rather than
        // dressed up as a fault; the message rate above is the health signal.
        if (node.sdrUp && typeof node.aircraftNow === 'number') {
          out += chip('', node.aircraftNow + (node.aircraftNow === 1 ? ' aircraft' : ' aircraft'));
        }
        if (typeof node.maxRangeKm === 'number' && node.maxRangeKm > 0) {
          out += chip('', Math.round(node.maxRangeKm) + ' km range');
        }
        if (node.feedEnabled === false) out += chip('off', 'Feed off');
        else if (node.uploading) out += chip('ok', 'Uploading');
        else out += chip('', 'Feed on');
        chips = out;
      } else if (isPager) {
        let out = '';
        if (!node.sdrUp) out += chip('warn', 'No readers');
        else if (node.decoding) out += chip('ok', 'Decoding ' + (decodedLabels.length ? decodedLabels.join(' + ') : 'POCSAG'));
        else out += chip('', 'Idle');
        if (node.feedEnabled === false) out += chip('off', 'Feed off');
        else if (node.uploading) out += chip('ok', 'Uploading');
        else out += chip('', 'Feed on');
        chips = out;
      } else {
        let out = '';
        if (!node.sdrUp) out += chip('warn', 'Receiver down');
        else if (node.decoding) out += chip('ok', 'Decoding');
        else out += chip('', 'Idle');
        if (node.feedEnabled === false) out += chip('off', 'Feed off');
        else if (node.uploading) out += chip('ok', 'Uploading');
        else out += chip('', 'Feed on');
        // First-run setup: SDR-Trunk calibrates the CPU and installs the JMBE
        // codec as it starts, then restarts itself once. The control server is
        // already answering /status throughout, so an up-but-uncalibrated
        // receiver is mid-setup, not broken.
        //
        // Volunteers get ONE plain-language chip for that whole phase. Showing
        // "Not calibrated" and "No JMBE audio" side by side reads as two faults
        // on a brand-new node when it is simply normal first-run progress, and
        // sends people hunting for something to fix. Purple (.updating) is the
        // page's existing in-progress colour, not the amber warning one.
        const preparing = node.sdrUp && node.calibrated === false;
        if (preparing) {
          // Deliberately does NOT promise "about a minute". Measured on a fresh
          // node the CPU calibration alone ran past four minutes and was still
          // going — each benchmark takes ~5s and there are dozens. Understating
          // it is what made a healthy node look hung and got it restarted
          // mid-calibration, which is the whole reason this chip exists.
          out += chip('updating', 'Preparing node — first-time setup, this can take several minutes');
        } else {
          if (node.calibrated === false) out += chip('warn', 'Not calibrated');
          if (node.jmbeInstalled === false) out += chip('warn', 'No JMBE audio');
        }
        chips = out;
      }

      let statHtml = '';
      if (online && agentCfg) {
        const parts = [];
        if (isPager) {
          const msgs = Number(node.messagesLast10m ?? node.callsLast10m ?? 0);
          parts.push(`<b>${msgs}</b> message${msgs === 1 ? '' : 's'} · last 10 min`);
          if (typeof node.readersUp === 'number') parts.push(`<b>${node.readersUp}</b> reader${node.readersUp === 1 ? '' : 's'} running`);
        } else if (isAdsb) {
          // Snapshots, not calls: an ADS-B node uploads its whole aircraft
          // table every 5 seconds, so ~120 in ten minutes is the healthy
          // number and "120 calls" would read as 120 separate events.
          const snaps = Number(node.callsLast10m || 0);
          parts.push(`<b>${snaps}</b> snapshot${snaps === 1 ? '' : 's'} uploaded · last 10 min`);
          if (typeof node.aircraftNow === 'number') {
            parts.push(`<b>${node.aircraftNow}</b> aircraft right now`);
          }
        } else {
          const calls = Number(node.callsLast10m || 0);
          parts.push(`<b>${calls}</b> call${calls === 1 ? '' : 's'} uploaded · last 10 min`);
        }
        if (typeof node.queueDepth === 'number' && node.queueDepth > 0) {
          parts.push(`<b>${node.queueDepth}</b> queued`);
        }
        // Calls the node accepted from its local rdio but could not save to
        // disk. They are gone, and nothing else here would show it: queueDepth
        // stays 0 for a dropped call, so a node shedding everything otherwise
        // looks healthy. Red because recordings are being lost right now —
        // usually a full or read-only disk.
        const dropped = Number(node.uploadsDropped || 0);
        if (dropped > 0) {
          parts.push(`<b style="color:var(--danger,#ef4444);">${dropped.toLocaleString()}</b> dropped`);
        }
        // Calls that WERE saved but the backend was unreachable for longer than the
        // queue holds them. Different failure to 'dropped' (disk), same outcome.
        const expired = Number(node.uploadsExpired || 0);
        if (expired > 0) {
          parts.push(`<b style="color:var(--danger,#ef4444);">${expired.toLocaleString()}</b> expired`);
        }
        statHtml = `<div class="node-stat">${parts.join(' &nbsp;·&nbsp; ')}</div>`;
      }

      const located = typeof node.lat === 'number' && typeof node.lon === 'number';
      const statusText = updating ? 'Updating…' : (online ? 'Online' : 'Offline');
      const statusCls = updating ? 'st-upd' : (online ? 'st-on' : 'st-off');
      // Pager nodes locate by State + LGA; radio nodes by RFS zone. ADS-B nodes
      // have no coarse area at all — the exact pin IS the location — so showing
      // "no region set" would flag a field this kind does not have.
      const areaLabel = isPager ? [node.state, node.lga].filter(Boolean).join(' · ') : node.zone;
      const regionItem = isAdsb
        ? ''
        : areaLabel
        ? `<span class="nl-item"><i class="fas fa-map"></i> ${escapeHtml(areaLabel)}</span>`
        : `<span class="nl-item nl-warn"><i class="fas fa-map"></i> no region set</span>`;
      const pinItem = located
        ? `<span class="nl-item"><i class="fas fa-location-dot"></i> ${isAdsb ? 'antenna pinned' : 'exact pin'}</span>`
        : (isAdsb ? `<span class="nl-item nl-warn"><i class="fas fa-location-dot"></i> no antenna pin — range unavailable</span>` : '');
      const keyItem = node.tokenPrefix ? `<span class="nl-item nl-key">key <code>${escapeHtml(node.tokenPrefix)}…</code></span>` : '';
      const _dlBtn = {
        windows: `<button class="mini-btn" title="Download Windows installer" onclick="downloadInstaller('windows','${node.id}',this)"><i class="fab fa-windows"></i> Windows</button>`,
        linux: `<button class="mini-btn" title="Download Linux installer" onclick="downloadInstaller('linux','${node.id}',this)"><i class="fab fa-linux"></i> Linux</button>`,
      };
      const dl = agentCfg ? agentCfg.platforms.map((p) => _dlBtn[p]).join('\n           ') : '';
      // Owners can view their pager node's recent decoded pages (rolling).
      const msgsBtn = isPager
        ? `<button class="mini-btn" title="Show recent decoded pages" onclick="showNodeMessages('${node.id}')"><i class="fas fa-envelope"></i> Messages</button>`
        : '';
      // Radio nodes: a light activity/stats view (calls, receptions, top
      // talkgroup/unit/site + recent calls) for their own node. ADS-B nodes get
      // their own renderer rather than a branch inside that one — the two
      // payloads share nothing beyond the word "activity".
      const statsBtn = isRadio
        ? `<button class="mini-btn" title="Show this node's activity & stats" onclick="showNodeStats('${node.id}')"><i class="fas fa-chart-line"></i> Activity</button>`
        : isAdsb
        ? `<button class="mini-btn" title="Show this receiver's performance & coverage" onclick="showAdsbStats('${node.id}')"><i class="fas fa-chart-line"></i> Activity</button>`
        : '';
      const actions = `
        <div class="node-actions">
          ${statsBtn}
          ${msgsBtn}
          ${dl}
          <button class="mini-btn" title="Set region / exact pin" onclick="openLocationPicker('${node.id}')"><i class="fas fa-location-dot"></i> ${areaLabel ? 'Location' : 'Set region'}</button>
          <button class="mini-btn" title="Re-issue key (invalidates the old installer)" onclick="rotateNode('${node.id}',this)"><i class="fas fa-key"></i></button>
          <button class="mini-btn danger" title="Delete node (cuts it off)" onclick="deleteFeederNode('${node.id}',this)"><i class="fas fa-trash"></i></button>
        </div>`;

      return `
        <div class="node-row">
          <span class="node-dot ${updating ? 'updating' : (online ? 'online' : '')}" title="${statusText}"></span>
          <div class="node-meta">
            <div class="node-head">
              <div class="node-name">${escapeHtml(name)} <span class="node-kind">${escapeHtml(_kindLabel[kind] || kind)}</span></div>
              ${agentHtml}
            </div>
            <div class="node-sub"><span class="${statusCls}">${statusText}</span> · last seen ${escapeHtml(lastSeen)}${uptimeHtml}</div>
            <div class="node-loc">${regionItem}${pinItem}${keyItem}</div>
            <div class="node-chips">${chips}</div>
            ${statHtml}
            ${actions}
          </div>
        </div>`;
    }

    // Owner view of a pager node's recent decoded pages (the rolling buffer the
    // backend keeps, same data staff see in the drawer). Polls every 5s while open.
    let _msgPoll = null;
    async function showNodeMessages(nodeId) {
      closeNodeMessages();
      const overlay = document.createElement('div');
      overlay.id = 'msg-modal';
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal msg-modal">
          <div class="msg-head">
            <h3><i class="fas fa-envelope-open-text"></i> Recent messages</h3>
            <button class="mini-btn" onclick="closeNodeMessages()">Close</button>
          </div>
          <div class="msg-sub" id="msg-sub">loading…</div>
          <div id="msg-list" class="msg-list"></div>
        </div>`;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeNodeMessages(); });
      document.body.appendChild(overlay);
      const load = async () => {
        try {
          const jwt = await getToken();
          const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/messages`, {
            headers: { 'Authorization': 'Bearer ' + jwt },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (document.getElementById('msg-modal')) _renderNodeMessages(data.messages || []);
        } catch (e) {
          const sub = document.getElementById('msg-sub');
          if (sub) sub.textContent = 'Could not load messages — try again shortly.';
        }
      };
      await load();
      _msgPoll = setInterval(load, 5000);
    }
    function _renderNodeMessages(msgs) {
      const list = document.getElementById('msg-list');
      const sub = document.getElementById('msg-sub');
      if (!list) return;
      const filteredN = msgs.filter(m => m.filtered).length;
      if (sub) sub.textContent = msgs.length
        ? `newest first · ${msgs.length} buffered${filteredN ? ` · ${filteredN} filtered (dimmed)` : ''}`
        : 'No messages decoded yet.';
      if (!msgs.length) {
        list.innerHTML = `<div class="msg-empty">Decoded pages will appear here as they come in.</div>`;
        return;
      }
      list.innerHTML = msgs.slice().reverse().map(m => {
        const at = m.at != null ? new Date(m.at) : null;
        const time = at && !Number.isNaN(at.getTime()) ? at.toLocaleTimeString() : '—';
        const filt = m.filtered ? ' msg-filtered' : '';
        const badge = m.filtered ? `<span class="msg-badge" title="Not forwarded (${escapeHtml(m.filtered)})">filtered</span>` : '';
        return `<div class="msg-row${filt}">
          <span class="msg-time">${escapeHtml(time)}</span>
          <span class="msg-body">${badge}<span class="msg-addr">${escapeHtml(m.address || '')}</span> ${escapeHtml(m.message || '')}</span>
          <span class="msg-src">${escapeHtml(m.source || '')}</span>
        </div>`;
      }).join('');
    }
    function closeNodeMessages() {
      if (_msgPoll) { clearInterval(_msgPoll); _msgPoll = null; }
      const m = document.getElementById('msg-modal'); if (m) m.remove();
    }

    // --- Per-node activity & stats (radio nodes) -----------------------------
    // A LIGHT owner-facing summary of what this node is hearing: calls,
    // receptions, top talkgroup / unit / site, and a short recent-call feed.
    // Deliberately less than the staff Data page. Polls every 15s while open.
    let _statsPoll = null;
    let _statsNodeId = null;
    let _statsWindow = '24h';
    function _statsName(nodeId) {
      const n = (_feederNodes || []).find(x => x.id === nodeId);
      return n ? (n.name || 'node') : 'node';
    }
    async function showNodeStats(nodeId) {
      closeNodeStats();
      _statsNodeId = nodeId;
      _statsWindow = '24h';
      const overlay = document.createElement('div');
      overlay.id = 'stats-modal';
      overlay.className = 'modal-overlay';
      const winBtn = (w, lbl) => `<button class="fs-win${w === _statsWindow ? ' active' : ''}" data-w="${w}" onclick="setStatsWindow('${w}')">${lbl}</button>`;
      overlay.innerHTML = `
        <div class="modal msg-modal fs-modal">
          <div class="msg-head">
            <h3><i class="fas fa-chart-line"></i> ${escapeHtml(_statsName(nodeId))} · activity</h3>
            <button class="mini-btn" onclick="closeNodeStats()">Close</button>
          </div>
          <div class="fs-wins">${winBtn('24h', '24h')}${winBtn('7d', '7 days')}${winBtn('30d', '30 days')}</div>
          <div id="stats-body"><div class="loading" style="padding:2rem;"><i class="fas fa-spinner"></i></div></div>
        </div>`;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeNodeStats(); });
      document.body.appendChild(overlay);
      await loadNodeStats();
      _statsPoll = setInterval(loadNodeStats, 15000);
    }
    function setStatsWindow(w) {
      if (w === _statsWindow) return;
      _statsWindow = w;
      document.querySelectorAll('#stats-modal .fs-win').forEach(b => b.classList.toggle('active', b.dataset.w === w));
      loadNodeStats();
    }
    async function loadNodeStats() {
      const nodeId = _statsNodeId;
      if (!nodeId) return;
      try {
        const jwt = await getToken();
        const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/stats?window=${encodeURIComponent(_statsWindow)}`, {
          headers: { 'Authorization': 'Bearer ' + jwt },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (document.getElementById('stats-modal')) _renderNodeStats(data);
      } catch (e) {
        const body = document.getElementById('stats-body');
        if (body) body.innerHTML = `<div class="msg-empty">Couldn't load activity — try again shortly.</div>`;
      }
    }
    function _statsTimeAgo(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.round(s / 60)}m ago`;
      if (s < 86400) return `${Math.round(s / 3600)}h ago`;
      return d.toLocaleDateString();
    }
    function _renderNodeStats(d) {
      const body = document.getElementById('stats-body');
      if (!body) return;
      const t = d.totals || {};
      const tile = (val, label) => `<div class="fs-tile"><div class="fs-tile-v">${Number(val || 0).toLocaleString()}</div><div class="fs-tile-l">${label}</div></div>`;
      const tiles = `<div class="fs-tiles">
        ${tile(t.logicalCalls, 'Calls')}
        ${tile(t.calls, 'Receptions')}
        ${tile(t.talkgroups, 'Talkgroups')}
        ${tile(t.radios, 'Units')}
        ${tile(t.sites, 'Sites')}
        ${tile(t.encryptedCalls, 'Encrypted')}
        ${tile(t.recordedCalls, 'With audio')}
      </div>`;

      // Agency rides along from the alias' SDR-Trunk group, and the alias
      // colour is server-validated to #rgb/#rrggbb before it reaches this
      // attribute. Both are what the staff Data page shows, so a contributor
      // recognises their own talkgroups by the same cues.
      const tg = (r) => {
        const dot = r.color
          ? `<span class="fs-dot" style="background:${escapeHtml(r.color)}"></span>`
          : '';
        const ag = r.agency
          ? ` <span class="fs-ag">${escapeHtml(String(r.agency))}</span>`
          : '';
        return `${dot}${escapeHtml(r.label || ('TG ' + r.talkgroup))}${ag}`;
      };
      const un = (r) => `${escapeHtml(r.alias || String(r.radio))}`;
      const st = (r) => `${escapeHtml(r.name || (r.rfss + '-' + r.site))}`;
      const listCol = (title, rows, fmt) => {
        const items = (rows || []).length
          ? rows.map(r => `<div class="fs-li"><span class="fs-li-n">${fmt(r)}</span><span class="fs-li-c">${Number(r.calls || 0).toLocaleString()}</span></div>`).join('')
          : `<div class="fs-li fs-li-empty">—</div>`;
        return `<div class="fs-col"><div class="fs-col-h">${title}</div>${items}</div>`;
      };
      const cols = `<div class="fs-cols">
        ${listCol('Top talkgroups', d.topTalkgroups, tg)}
        ${listCol('Top units', d.topRadios, un)}
        ${listCol('Top sites', d.topSites, st)}
      </div>`;

      const act = (d.activity || []).length
        ? `<div class="fs-act">${d.activity.map(a => {
            const tgTxt = a.talkgroupLabel || (a.talkgroup != null ? ('TG ' + a.talkgroup) : '—');
            const unTxt = a.sourceAlias || (a.sourceUnit != null ? String(a.sourceUnit) : '—');
            const site = a.siteName || (a.rfss != null && a.site != null ? (a.rfss + '-' + a.site) : '');
            const enc = a.encrypted ? `<span class="fs-enc">ENC</span>` : '';
            const rx = a.receptions > 1 ? `<span class="fs-rx" title="${a.receptions} receptions">×${a.receptions}</span>` : '';
            return `<div class="fs-arow">
              <span class="fs-atime">${escapeHtml(_statsTimeAgo(a.at))}</span>
              <span class="fs-atg">${enc}${escapeHtml(tgTxt)}</span>
              <span class="fs-aun"><i class="fas fa-user-astronaut"></i> ${escapeHtml(unTxt)}</span>
              <span class="fs-asite">${site ? `<i class="fas fa-tower-broadcast"></i> ${escapeHtml(site)}` : ''}</span>
              <span class="fs-arx">${rx}</span>
            </div>`;
          }).join('')}</div>`
        : `<div class="msg-empty">No calls heard in this window yet.</div>`;

      body.innerHTML = `${tiles}${cols}
        <div class="fs-act-h">Recent calls</div>
        ${act}`;
    }
    function closeNodeStats() {
      if (_statsPoll) { clearInterval(_statsPoll); _statsPoll = null; }
      _statsNodeId = null;
      const m = document.getElementById('stats-modal'); if (m) m.remove();
    }

    // ---- ADS-B receiver activity ----------------------------------------
    //
    // The owner's view of their own receiver, served by the same backend code
    // as the staff Data tab's — /api/feeder/nodes/:id/adsb calls the shared
    // adsbNodeView service, gated on ownership instead of a staff role, so the
    // two can never drift apart.
    //
    // The coverage map is loaded ONCE on open. The 15s poll refreshes the tiles
    // and tables, because redrawing several hundred polylines every fifteen
    // seconds inside a modal is not acceptable — and coverage built from eight
    // hours of traffic does not visibly change in that time anyway.
    let _abNodeId = null;
    let _abWindow = '24h';
    let _abPoll = null;
    let _abMap = null;
    let _abLayer = null;

    /** Epoch ms → local clock time. The backend sends ms for these. */
    /** One colour per aircraft, derived from its hex, so adjacent paths stay
     *  distinguishable without a legend nobody would read. Shared by the track
     *  and its row in the table — the whole point is that they match. */
    /** Where a bearing and a distance put you, from a point on the globe.
     *
     *  The coverage envelope is polar — a reach in km for each of 72 bearings —
     *  so putting it on a map means solving for the destination of each one.
     *  Great-circle rather than a flat offset: at 200km the difference is
     *  visible, and it is the far bearings that the picture is about. */
    function _abDestination(lat, lon, bearingDeg, km) {
      const R = 6371;
      const d = km / R;
      const br = bearingDeg * Math.PI / 180;
      const la1 = lat * Math.PI / 180;
      const lo1 = lon * Math.PI / 180;
      const la2 = Math.asin(Math.sin(la1) * Math.cos(d)
        + Math.cos(la1) * Math.sin(d) * Math.cos(br));
      const lo2 = lo1 + Math.atan2(
        Math.sin(br) * Math.sin(d) * Math.cos(la1),
        Math.cos(d) - Math.sin(la1) * Math.sin(la2));
      return [la2 * 180 / Math.PI, ((lo2 * 180 / Math.PI) + 540) % 360 - 180];
    }

    /** The envelope as map shapes: one filled fan per run of bearings that
     *  have actually been heard on.
     *
     *  NOT one ring through all 72 bearings. That was the previous attempt and
     *  it produced the spikes: a bearing with no data has no radius, so it was
     *  pulled to the receiver, and the polygon then ran from a real reach all
     *  the way to the centre and back out again. Those long edges cut straight
     *  through airspace the receiver covers perfectly well, which is why the
     *  tracks appeared to escape the shape.
     *
     *  A bucket is a five-degree SECTOR, so that is what gets drawn — out along
     *  one edge, across at its measured range, back down the other. Runs of
     *  neighbouring buckets are merged into a single fan so there are no seams
     *  inside a covered region, and a gap is simply absent rather than being
     *  drawn as a notch. Nothing is claimed about a bearing that has never
     *  heard anything, which is the whole point. */
    function _abCoverageRing(site, buckets) {
      if (!site || !Array.isArray(buckets) || !buckets.length) return null;
      const n = buckets.length;
      const step = 360 / n;
      const centre = [site.lat, site.lon];
      const km = buckets.map((v) =>
        (typeof v === 'number' && isFinite(v) && v > 0) ? v : 0);
      if (!km.some((v) => v > 0)) return null;

      const edge = (i, r) => _abDestination(site.lat, site.lon, i * step, r);
      // The outer boundary of one bucket: a step at its own radius, rather
      // than a line sloping to its neighbour's.
      const wedge = (out, i) => { out.push(edge(i, km[i]), edge(i + 1, km[i])); };

      // Every bearing heard on: one closed ring, no centre point at all.
      if (km.every((v) => v > 0)) {
        const ring = [];
        for (let i = 0; i < n; i++) wedge(ring, i);
        return [ring];
      }

      // Otherwise walk from a gap so a run cannot be split across the wrap.
      let start = 0;
      while (km[start] > 0) start += 1;

      const shapes = [];
      let run = null;
      for (let c = 0; c < n; c++) {
        const i = (start + c) % n;
        if (km[i] > 0) {
          if (!run) run = [];
          run.push(i);
        } else if (run) {
          shapes.push(run);
          run = null;
        }
      }
      if (run) shapes.push(run);

      return shapes.map((r) => {
        const poly = [centre];
        for (const i of r) wedge(poly, i);
        poly.push(centre);
        return poly;
      });
    }

    let _abCoverageOn = false;
    let _abCoverageLayer = null;
    let _abCoverageGeom = null;

    window.abToggleCoverage = function () {
      _abCoverageOn = !_abCoverageOn;
      _abApplyCoverage();
    };

    /** Add or remove the overlay to match the toggle. */
    function _abApplyCoverage() {
      const btn = document.getElementById('adsb-cov-btn');
      if (btn) {
        btn.classList.toggle('on', _abCoverageOn);
        btn.textContent = _abCoverageOn ? 'Hide coverage' : 'Show coverage';
      }
      if (_abCoverageLayer) { _abCoverageLayer.remove(); _abCoverageLayer = null; }
      if (!_abCoverageOn || !_abMap || !_abCoverageGeom) return;

      const layer = L.layerGroup();
      for (const poly of _abCoverageGeom) {
        L.polygon(poly, {
          color: '#c084fc', weight: 1, opacity: 0.55,
          fillColor: '#c084fc', fillOpacity: 0.10, interactive: false,
        }).addTo(layer);
      }
      _abCoverageLayer = layer.addTo(_abMap);
      // Behind the tracks. Leaflet paints later additions on top, and coverage
      // over the paths hides the thing the map is for.
      layer.eachLayer((l) => l.bringToBack && l.bringToBack());
    }

    function _abHexColour(hex) {
      const hue = (parseInt(String(hex).slice(-4), 16) || 0) % 360;
      return `hsl(${hue}, 80%, 62%)`;
    }

    /** hex -> colour for the traces actually DRAWN. Only aircraft with a path
     *  are in here, so the table tints exactly the rows the map can show. */
    let _abTrackColour = {};

    /** Hover label: callsign if it transmitted one, the registration and type
     *  the aggregators resolved, and the hex, which is the only part always
     *  known. */
    function _abTraceLabel(tr) {
      const bits = [];
      if (tr.callsign) bits.push(`<b>${escapeHtml(String(tr.callsign).trim())}</b>`);
      if (tr.reg) bits.push(escapeHtml(tr.reg));
      if (tr.type) bits.push(`<span style="opacity:0.75">${escapeHtml(tr.type)}</span>`);
      bits.push(`<span style="opacity:0.55">${escapeHtml(String(tr.hex).toUpperCase())}</span>`);
      return bits.join(' · ');
    }

    /** Tint the Recently heard rows to their track colour.
     *
     *  Called from both sides: the tracks response paints whatever table is
     *  already there, and the table paints itself from what the tracks response
     *  left behind. Either can land first, and a re-render of one must not
     *  silently drop the other's work. */
    function _abPaintHeard() {
      document.querySelectorAll('#adsb-body .ab-hex[data-hex]').forEach((el) => {
        const c = _abTrackColour[el.dataset.hex];
        // No colour means no path was drawn for it — heard, but not enough to
        // draw. Leaving it default is the honest signal.
        el.style.color = c || '';
      });
    }

    function _abClock(ms) {
      if (!ms) return '—';
      const d = new Date(ms);
      if (Number.isNaN(d.getTime())) return '—';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function showAdsbStats(nodeId) {
      closeAdsbStats();
      _abNodeId = nodeId;
      _abWindow = '24h';
      const overlay = document.createElement('div');
      overlay.id = 'adsb-modal';
      overlay.className = 'modal-overlay';
      const winBtn = (w, lbl) => `<button class="fs-win${w === _abWindow ? ' active' : ''}" data-w="${w}" onclick="setAdsbWindow('${w}')">${lbl}</button>`;
      overlay.innerHTML = `
        <div class="modal msg-modal fs-modal">
          <div class="msg-head">
            <h3><i class="fas fa-plane"></i> ${escapeHtml(_statsName(nodeId))} · receiver</h3>
            <button class="mini-btn" onclick="closeAdsbStats()">Close</button>
          </div>
          <div class="fs-wins">${winBtn('24h', '24h')}${winBtn('7d', '7 days')}${winBtn('30d', '30 days')}</div>
          <div id="adsb-body"><div class="loading" style="padding:2rem;"><i class="fas fa-spinner"></i></div></div>
          <div class="fs-act-h">Coverage</div>
          <div id="adsb-polar"><div class="ab-note">Loading coverage…</div></div>
          <div class="fs-act-h">Tracks — last 8 hours
            <button type="button" class="ab-cov-btn" id="adsb-cov-btn"
                    onclick="abToggleCoverage()"
                    title="Draw the coverage envelope over the map">Show coverage</button>
          </div>
          <div class="ab-map" id="adsb-map"></div>
          <div class="ab-note" id="adsb-map-note">Loading tracks…</div>
        </div>`;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeAdsbStats(); });
      document.body.appendChild(overlay);
      await loadAdsbStats();
      // Only after the overlay is in the DOM and sized, or Leaflet measures a
      // zero-height container and renders a blank tile grid.
      loadAdsbCoverage();
      _abPoll = setInterval(loadAdsbStats, 15000);
    }

    function setAdsbWindow(w) {
      if (w === _abWindow) return;
      _abWindow = w;
      document.querySelectorAll('#adsb-modal .fs-win').forEach(b => b.classList.toggle('active', b.dataset.w === w));
      loadAdsbStats();
    }

    async function loadAdsbStats() {
      const nodeId = _abNodeId;
      if (!nodeId) return;
      try {
        const jwt = await getToken();
        const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/adsb?window=${encodeURIComponent(_abWindow)}`, {
          headers: { 'Authorization': 'Bearer ' + jwt },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (document.getElementById('adsb-modal') && _abNodeId === nodeId) _renderAdsbStats(data);
      } catch (e) {
        const body = document.getElementById('adsb-body');
        if (body) body.innerHTML = `<div class="msg-empty">Couldn't load this receiver — try again shortly.</div>`;
      }
    }

    function _renderAdsbStats(d) {
      const body = document.getElementById('adsb-body');
      if (!body) return;
      const t = d.totals || {};
      const live = d.live || {};
      const online = !!d.online;

      // Live figures come from the agent's heartbeat, so they are absent while
      // the receiver is offline — shown as "—", never as zero, which would
      // claim a working receiver is hearing nothing.
      const tile = (v, label, tip) => `<div class="fs-tile"${tip ? ` title="${escapeHtml(tip)}"` : ''}><div class="fs-tile-v">${v}</div><div class="fs-tile-l">${label}</div></div>`;
      const n = (v) => (v == null ? '—' : Number(v).toLocaleString());
      // Closest and furthest rather than one "range": alone, the figure moved
      // whenever the furthest aircraft left the sky, so it described the
      // traffic as much as the receiver. The pair reads as the slice of sky in
      // view, and a closest that climbs is a receiver going deaf near in.
      const km = (v) => (v == null ? '—' : Math.round(v) + ' km');
      const tiles = `<div class="fs-tiles" style="grid-template-columns:repeat(5,1fr);">
        ${tile(online ? n(live.aircraftNow) : '—', 'Aircraft now')}
        ${tile(live.msgRate == null ? '—' : Number(live.msgRate).toFixed(1) + '/s', 'Message rate')}
        ${tile(km(live.nearestKm), 'Closest aircraft')}
        ${tile(km(live.furthestKm), 'Furthest aircraft')}
        ${tile(live.gainNow == null ? '—' : Number(live.gainNow).toFixed(1) + ' dB', 'Gain')}
      </div>
      <div class="fs-tiles" style="grid-template-columns:repeat(4,1fr);">
        ${tile(n(t.positions), 'Positions')}
        ${tile(n(t.snapshots), 'Snapshots')}
        ${tile(n(t.maxAircraft), 'Peak aircraft')}
        ${tile(t.maxRangeKm == null ? '—' : Math.round(t.maxRangeKm) + ' km', 'Best range',
          'The furthest aircraft seen in the uploads this receiver sent, over the selected window. The decoder can report a higher lifetime best: it sees every position it decodes, while this sees the aircraft present each time it uploads.')}
      </div>`;

      const days = (d.days || []).slice().reverse();
      const daily = days.length
        ? `<div class="ab-scroll"><table class="ab-tbl">
            <thead><tr><th>Day</th><th class="num">Positions</th><th class="num">Peak aircraft</th><th class="num">Best range</th><th class="num">Peak msg rate</th></tr></thead>
            <tbody>${days.map(x => `<tr>
              <td>${escapeHtml(String(x.day))}</td>
              <td class="num">${Number(x.positions || 0).toLocaleString()}</td>
              <td class="num">${Number(x.maxAircraft || 0).toLocaleString()}</td>
              <td class="num">${x.maxRangeKm ? Math.round(x.maxRangeKm) + ' km' : '—'}</td>
              <td class="num">${x.msgRateMax ? Number(x.msgRateMax).toFixed(1) + '/s' : '—'}</td>
            </tr>`).join('')}</tbody></table></div>`
        : `<div class="msg-empty">Nothing recorded in this window yet.</div>`;

      const recent = d.recent || [];
      const heard = recent.length
        ? `<div class="ab-scroll"><table class="ab-tbl">
            <thead><tr><th>Aircraft</th><th class="num">Altitude</th><th class="num">Peak</th><th class="num">Reports</th><th>First</th><th>Last</th></tr></thead>
            <tbody>${recent.map(a => `<tr>
              <td><span class="ab-hex" data-hex="${escapeHtml(String(a.hex || '').toLowerCase())}">${escapeHtml(String(a.hex || '').toUpperCase())}</span>${a.callsign ? ` <span class="ab-soft">${escapeHtml(a.callsign)}</span>` : ''}</td>
              <td class="num">${a.lastAltFt == null ? '—' : Number(a.lastAltFt).toLocaleString() + ' ft'}</td>
              <td class="num">${a.maxAltFt == null ? '—' : Number(a.maxAltFt).toLocaleString() + ' ft'}</td>
