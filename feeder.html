  <style>
    /* Tokens mirror staff.html so the page looks native to the admin/site. */
    :root {
      --bg-dark: #060a15;
      --bg-card: #0e1728;
      --bg-card-2: #121e33;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #f1f5f9;
      --text-soft: #94a3b8;
      --brand: #f97316;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --accent-border: rgba(56, 189, 248, 0.35);
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(900px 480px at 85% -10%, rgba(56, 189, 248, 0.06), transparent 60%),
        radial-gradient(700px 420px at -10% 0%, rgba(249, 115, 22, 0.05), transparent 55%),
        var(--bg-dark);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
    }

    ::selection { background: rgba(56, 189, 248, 0.3); }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }

    /* Header — sticky glassy topbar (mirrors staff.html). */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin: 0 -2rem 1.75rem;
      padding: 1rem 2rem;
      background: rgba(6, 10, 21, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
    .header h1 span { color: var(--brand); }
    .header-actions { display: flex; gap: 0.6rem; align-items: center; flex-shrink: 0; }

    .btn {
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: rgba(148, 163, 184, 0.35); }
    .btn-danger { background: rgba(239, 68, 68, 0.13); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.26); color: #fca5a5; }

    /* Big platform download buttons. */
    .dl-row { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.25rem 0 0.5rem; }
    .dl-btn {
      flex: 1 1 220px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 1.1rem 1.4rem;
      border-radius: 12px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: #bae6fd;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .dl-btn i { font-size: 1.4rem; }
    .dl-btn:hover:not(:disabled) { background: rgba(56, 189, 248, 0.25); color: #e0f2fe; }
    .dl-btn:active { transform: translateY(1px); }
    .dl-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 55%),
        var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }
    .card-head .icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.14);
      color: var(--success);
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .card-head h2 { font-size: 1.2rem; font-weight: 700; }
    .card-sub { color: var(--text-soft); font-size: 0.9rem; line-height: 1.5; }

    .steps {
      display: flex; gap: 0.6rem; flex-wrap: wrap;
      margin: 1.1rem 0 0.4rem;
    }
    .step {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .step b { color: var(--accent); }

    .note {
      margin-top: 1rem;
      font-size: 0.82rem;
      color: var(--text-soft);
      line-height: 1.6;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
    }
    .note i { color: var(--warning); margin-right: 0.35rem; }
    .note a { color: var(--accent); text-decoration: none; }
    .note a:hover { text-decoration: underline; }

    .token-line {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--text-soft);
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .token-line code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.5rem;
      border-radius: 5px;
      color: #7dd3fc;
    }

    /* Platform (Windows / Linux) download cards. */
    .plat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.35rem 0 0.5rem;
    }
    .plat {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.15rem 1.2rem 1.25rem;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 60%),
        var(--bg-card-2);
    }
    .plat-head { display: flex; align-items: baseline; gap: 0.55rem; }
    .plat-head i { font-size: 1.2rem; color: var(--accent); position: relative; top: 2px; }
    .plat-head h3 { font-size: 1.05rem; font-weight: 700; }
    .plat-head .plat-tag { margin-left: auto; font-size: 0.72rem; color: var(--text-soft); }
    .plat .dl-btn { width: 100%; margin: 1rem 0 0; }
    .plat ol {
      list-style: none;
      counter-reset: step;
      margin: 1rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .plat ol li {
      counter-increment: step;
      position: relative;
      padding-left: 2rem;
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-primary);
    }
    .plat ol li::before {
      content: counter(step);
      position: absolute;
      left: 0; top: 0.05rem;
      width: 1.4rem; height: 1.4rem;
      border-radius: 50%;
      background: var(--accent-soft);
      color: #7dd3fc;
      border: 1px solid var(--accent-border);
      font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .plat ol li b { color: var(--accent); font-weight: 600; }
    .cmd {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.5rem;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0.4rem 0.5rem 0.4rem 0.6rem;
    }
    .cmd code {
      flex: 1; min-width: 0;
      overflow-x: auto; white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; color: #7dd3fc;
    }
    .cmd button {
      flex-shrink: 0;
      background: transparent; border: none;
      color: var(--text-soft); cursor: pointer;
      font-size: 0.85rem; padding: 0.15rem 0.3rem; border-radius: 5px;
      transition: color 0.15s ease;
    }
    .cmd button:hover { color: var(--accent); }
    .plat .note { margin-top: 0.9rem; }

    /* Section header inside a card. */
    .section-h {
      display: flex; align-items: center; gap: 0.75rem;
      color: var(--text-soft);
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      margin: 1.75rem 0 1rem; font-weight: 600;
    }
    .section-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-subtle), transparent); }

    /* Node list rows. */
    .node-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .node-row {
      display: flex; align-items: center; gap: 0.85rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.85rem 1rem;
    }
    .node-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-soft); opacity: 0.5; flex-shrink: 0; }
    .node-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(34, 197, 94, 0.55); opacity: 1; }
    .node-meta { flex: 1; min-width: 0; }
    .node-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-sub { color: var(--text-soft); font-size: 0.78rem; margin-top: 0.15rem; }
    .node-ver {
      font-size: 0.72rem; color: #7dd3fc;
      background: var(--accent-soft);
      padding: 0.16rem 0.5rem; border-radius: 5px; white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--text-soft);
      background: var(--bg-card);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
    }
    .empty-state i { font-size: 2.2rem; margin-bottom: 0.85rem; opacity: 0.4; display: block; }

    .loading { display: flex; align-items: center; justify-content: center; padding: 4rem; }
    .loading i { font-size: 1.8rem; color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toasts (mirrors staff.html). */
    #toast-stack {
      position: fixed; bottom: 1.25rem; right: 1.25rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      z-index: 3000; pointer-events: none;
    }
    .toast {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg-card-2);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--text-primary);
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.6);
      max-width: 340px;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.success i { color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.error i { color: var(--danger); }
    .toast.fade-out { opacity: 0; transition: opacity 0.3s ease; }

    @media (max-width: 768px) {
      .container { padding: 1rem 1rem 2rem; }
      .header { margin: 0 -1rem 1.25rem; padding: 0.85rem 1rem; flex-wrap: wrap; }
      .card { padding: 1.2rem 1.1rem; }
    }
  </style>

<body>
  <div class="container">
    <div class="header">
      <h1>Radio <span>Feeder</span></h1>
      <div class="header-actions">
        <a href="map.html" class="btn btn-secondary"><i class="fas fa-map"></i> Map</a>
        <button class="btn btn-danger" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <!-- Feeder cards live in this container. Phase 1 ships the radio card;
         aircraft / pager feeder cards can be appended here later as their
         backend endpoints land — each is a self-contained .card. -->
    <div id="feeder-cards">
      <div class="loading"><i class="fas fa-spinner"></i></div>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let _pollTimer = null;
    const _pollIntervalMs = 15_000;

    function escapeHtml(value) {
      if (value == null) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, kind = 'success', ms = 3500) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle' };
      const el = document.createElement('div');
      el.className = `toast ${kind}`;
      el.innerHTML = `<i class="fas ${icons[kind] || icons.success}"></i><span></span>`;
      el.querySelector('span').textContent = message;
      stack.appendChild(el);
      setTimeout(() => { el.classList.add('fade-out'); setTimeout(() => el.remove(), 350); }, ms);
    }

    function fmtLastSeen(value) {
      if (value == null || value === '') return 'never';
      let d;
      if (typeof value === 'number') d = new Date(value < 1e12 ? value * 1000 : value);
      else {
        const n = Number(value);
        d = (!Number.isNaN(n) && String(value).trim() !== '')
          ? new Date(n < 1e12 ? n * 1000 : n)
          : new Date(value);
      }
      if (Number.isNaN(d.getTime())) return 'unknown';
      const secs = Math.round((Date.now() - d.getTime()) / 1000);
      if (secs < 0) return 'just now';
      if (secs < 60) return `${secs}s ago`;
      if (secs < 3600) return `${Math.round(secs / 60)}m ago`;
      if (secs < 86400) return `${Math.round(secs / 3600)}h ago`;
      return d.toLocaleDateString();
    }

    // Current Supabase access token — required as a Bearer for every
    // /api/feeder call (the endpoints gate on the JWT, not the API_KEY).
    async function getToken() {
      const { data } = await sb.auth.getSession();
      return data?.session?.access_token || null;
    }

    async function doLogout() {
      if (typeof umami !== 'undefined') umami.track('logout');
      await sb.auth.signOut();
      window.location.href = 'login.html';
    }

    // --- Boot: require a session, else bounce to the login page (keeping a
    // ?redirect= back here, exactly like the rest of the site). ---
    async function boot() {
      const { data } = await sb.auth.getSession();
      if (!data.session) {
        window.location.href = 'login.html?redirect=' + encodeURIComponent('/feeder.html');
        return;
      }
      await loadFeeder();
    }

    async function loadFeeder() {
      const container = document.getElementById('feeder-cards');
      try {
        const token = await getToken();
        if (!token) {
          window.location.href = 'login.html?redirect=' + encodeURIComponent('/feeder.html');
          return;
        }
        const res = await fetch(`${API_BASE_URL}/api/feeder/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 403) { stopPolling(); renderNotContributor(); return; }
        if (res.status === 503) { stopPolling(); renderNotConfigured(); return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        renderRadioCard(data);
        startPolling();
      } catch (e) {
        console.error('Error loading feeder:', e);
        stopPolling();
        if (container) container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-triangle-exclamation"></i>
            <p>Couldn't load your feeder details.<br><span style="font-size:0.8rem;">${escapeHtml(e.message)}</span></p>
            <button class="btn btn-secondary" style="margin-top:1rem;" onclick="loadFeeder()"><i class="fas fa-sync-alt"></i> Retry</button>
          </div>`;
      }
    }

    function renderNotContributor() {
      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon" style="background: rgba(148,163,184,0.14); color: var(--text-soft);"><i class="fas fa-lock"></i></div>
            <h2>You're not set up as a radio feeder yet</h2>
          </div>
          <p class="card-sub">
            Radio feeding is invite-based. If you'd like to run a feeder node and contribute
            scanner audio, request access below and a staff member will set you up.
          </p>
          <div class="dl-row">
            <a class="dl-btn" href="editor-signup.html" style="text-decoration:none;">
              <i class="fas fa-user-plus"></i> Request feeder access
            </a>
          </div>
          <p class="card-sub" style="margin-top:0.75rem;">
            Already asked? It may still be pending — or reach out to staff on
            <a href="https://discord.forcequit.xyz" target="_blank" style="color:var(--accent);text-decoration:none;">Discord</a>.
          </p>
        </div>`;
    }

    function renderNotConfigured() {
      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon" style="background: rgba(245,158,11,0.14); color: var(--warning);"><i class="fas fa-screwdriver-wrench"></i></div>
            <h2>Feeder system not configured yet</h2>
          </div>
          <p class="card-sub">The radio feeder backend isn't switched on for this deployment yet — check back soon.</p>
        </div>`;
    }

    function renderRadioCard(data) {
      const nodes = data.nodes || [];
      const tokenPrefix = data.tokenPrefix || '';

      const nodesHtml = nodes.length
        ? `<div class="node-list">${nodes.map(_nodeRow).join('')}</div>`
        : `<div class="empty-state">
             <i class="fas fa-satellite-dish"></i>
             <p>No node connected yet — download and run the installer to get started.</p>
           </div>`;

      const tokenHtml = tokenPrefix
        ? `<div class="token-line"><i class="fas fa-key"></i> Node key: <code>${escapeHtml(tokenPrefix)}…</code></div>`
        : '';

      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon"><i class="fas fa-radio"></i></div>
            <h2>Radio Feeder</h2>
          </div>
          <p class="card-sub">
            Your personal installer sets up a feeder node that streams NSW PSN scanner audio to the network.
            It's pre-configured with your key — download it, run it, done. Pick your platform below.
          </p>

          <div class="plat-grid">
            <div class="plat">
              <div class="plat-head">
                <i class="fab fa-windows"></i>
                <h3>Windows</h3>
                <span class="plat-tag">Windows 10 / 11</span>
              </div>
              <button class="dl-btn" id="dl-windows" onclick="downloadInstaller('windows', this)">
                <i class="fas fa-download"></i> Download for Windows
              </button>
              <ol>
                <li>Click <b>Download for Windows</b> — it saves a small setup file with your key baked in.</li>
                <li>Right-click the downloaded file and choose <b>Run with PowerShell</b>, then approve the admin prompt.</li>
                <li>That's it — your node registers itself and starts running in the background.</li>
              </ol>
              <div class="note">
                <i class="fas fa-circle-info"></i>
                Using an <strong>RTL-SDR</strong> dongle? Install its WinUSB driver once with
                <a href="https://zadig.akeo.ie/" target="_blank" rel="noopener">Zadig</a>.
              </div>
            </div>

            <div class="plat">
              <div class="plat-head">
                <i class="fab fa-linux"></i>
                <h3>Linux</h3>
                <span class="plat-tag">amd64 / arm64</span>
              </div>
              <button class="dl-btn" id="dl-linux" onclick="downloadInstaller('linux', this)">
                <i class="fas fa-download"></i> Download for Linux
              </button>
              <ol>
                <li>Click <b>Download for Linux</b> — it saves a shell script with your key inlined.</li>
                <li>Run it from a terminal (in the download folder):
                  <div class="cmd">
                    <code id="linux-cmd">sudo bash install-nswpsn-node.sh</code>
                    <button type="button" title="Copy" onclick="copyCmd(this)"><i class="far fa-copy"></i></button>
                  </div>
                </li>
                <li>Done — it installs a systemd service that starts on boot.</li>
              </ol>
              <div class="note">
                <i class="fas fa-circle-info"></i>
                udev rules for common SDRs are installed automatically — no driver swap needed.
              </div>
            </div>
          </div>

          ${tokenHtml}

          <div class="section-h">Your nodes</div>
          <div id="nodes-region">${nodesHtml}</div>
        </div>`;
    }

    function _nodeRow(node) {
      const online = !!node.online;
      const name = node.name || 'Unnamed node';
      const lastSeen = fmtLastSeen(node.lastSeen != null ? node.lastSeen : node.last_seen);
      const agent = node.agentVersion || node.agent_version;
      const agentHtml = agent ? `<span class="node-ver">agent ${escapeHtml(agent)}</span>` : '';
      return `
        <div class="node-row">
          <span class="node-dot ${online ? 'online' : ''}" title="${online ? 'Online' : 'Offline'}"></span>
          <div class="node-meta">
            <div class="node-name">${escapeHtml(name)}</div>
            <div class="node-sub">${online ? 'Online' : 'Offline'} · last seen ${escapeHtml(lastSeen)}</div>
          </div>
          ${agentHtml}
        </div>`;
    }

    // Authenticated installer download: the endpoint needs the JWT header,
    // so a plain <a href> won't work — fetch as a blob and save it client-side.
    async function downloadInstaller(platform, btn) {
      const original = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing…'; }
      try {
        const token = await getToken();
        if (!token) { window.location.href = 'login.html?redirect=' + encodeURIComponent('/feeder.html'); return; }

        const res = await fetch(`${API_BASE_URL}/api/feeder/download/${platform}`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const blob = await res.blob();

        // Prefer the server-provided filename (Content-Disposition), else a
        // sensible per-platform default. The header is only readable if the
        // backend exposes it via Access-Control-Expose-Headers.
        let filename = platform === 'windows' ? 'install-nswpsn-node.ps1' : 'install-nswpsn-node.sh';
        const cd = res.headers.get('Content-Disposition') || '';
        const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
        if (m && m[1]) { try { filename = decodeURIComponent(m[1].trim()); } catch (e) { filename = m[1].trim(); } }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showToast('Installer downloaded.', 'success');
      } catch (e) {
        console.error('Download failed:', e);
        showToast(`Download failed: ${e.message}`, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = original; }
      }
    }

    // Copy the Linux install command to the clipboard (with a brief tick).
    function copyCmd(btn) {
      const el = document.getElementById('linux-cmd');
      const text = el ? el.textContent : 'sudo bash install-nswpsn-node.sh';
      const done = () => {
        if (!btn) return;
        const prev = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check" style="color:var(--success)"></i>';
        setTimeout(() => { btn.innerHTML = prev; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => showToast('Copy failed', 'error'));
      } else {
        try {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove(); done();
        } catch (e) { showToast('Copy failed', 'error'); }
      }
    }

    // Poll /api/feeder/me every 15s to keep node status fresh. We re-render
    // only the nodes region so download buttons don't flicker mid-click.
    function startPolling() {
      if (_pollTimer) return;
      _pollTimer = setInterval(refreshNodes, _pollIntervalMs);
    }
    function stopPolling() {
      if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
    }
    async function refreshNodes() {
      try {
        const token = await getToken();
        if (!token) { stopPolling(); return; }
        const res = await fetch(`${API_BASE_URL}/api/feeder/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) return; // transient — keep the last good render
        const data = await res.json();
        const region = document.getElementById('nodes-region');
        if (!region) return;
        const nodes = data.nodes || [];
        region.innerHTML = nodes.length
          ? `<div class="node-list">${nodes.map(_nodeRow).join('')}</div>`
          : `<div class="empty-state">
               <i class="fas fa-satellite-dish"></i>
               <p>No node connected yet — download and run the installer to get started.</p>
             </div>`;
      } catch (e) { /* keep last render on transient errors */ }
    }

    // Pause polling when the tab is hidden; resume on return.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopPolling();
      else if (document.getElementById('nodes-region')) { refreshNodes(); startPolling(); }
    });

    boot();
  </script>
</body>
</html>
