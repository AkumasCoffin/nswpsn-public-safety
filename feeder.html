              <td class="num">${Number(a.reports || 0).toLocaleString()}</td>
              <td class="ab-soft">${_abClock(a.firstMs)}</td>
              <td class="ab-soft">${_abClock(a.lastMs)}</td>
            </tr>`).join('')}</tbody></table></div>`
        : `<div class="msg-empty">Nothing heard in the last 8 hours.</div>`;

      body.innerHTML = `${tiles}
        <div class="fs-act-h">Daily</div>${daily}
        <div class="fs-act-h">Recently heard <span class="ab-soft" style="text-transform:none;letter-spacing:0;">— last 8 hours</span></div>${heard}`;
      // The tracks response may already have landed, and rebuilding this table
      // threw its tinting away with the old rows.
      _abPaintHeard();
    }


    /* ---- Coverage, as a polar range plot ----
     *
     * Its own picture, not an overlay on the track map. The two answer
     * different questions and want different framing: coverage is "how far, on
     * every bearing, over weeks"; tracks are "what crossed in the last eight
     * hours". Drawing the envelope on the map also forced the map to frame the
     * whole envelope, which squashed the tracks down to a few pixels.
     *
     * Inline SVG rather than a chart library: feeder.html carries no charting
     * dependency, and this has to render identically in both pages. */

    /** Ring steps, so the labels are always round numbers.
     *
     *  Scaling to the max and dividing by four gave rings "every 13 km", which
     *  is a number nobody can read a distance off. The step is chosen first
     *  and the outer ring follows from it. */
    const ENV_STEPS = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500];

    /** {step, rings, max} for a given furthest range. Four or five rings, so a
     *  step that fits is always available without stretching the plot. */
    function ENV_scaleFor(maxKm) {
      for (const step of ENV_STEPS) {
        if (step * 5 >= maxKm) {
          const rings = Math.max(1, Math.ceil(maxKm / step));
          return { step, rings, max: step * rings };
        }
      }
      const step = Math.ceil(maxKm / 5 / 500) * 500;
      return { step, rings: 5, max: step * 5 };
    }

    /**
     * How much of the circle has ever been heard on.
     *
     * Decides how the shape is drawn. A polygon through mostly-empty bearings
     * collapses into a star of thin spikes — each measured bearing reaching
     * out and every neighbour pinned to the centre — which reads as a fault
     * rather than as a young receiver. Below the threshold the measured
     * bearings are drawn as spokes instead, which is honest about being sparse
     * and looks deliberate.
     */
    function ENV_filledRatio(buckets) {
      const n = (buckets || []).length;
      if (!n) return 0;
      let got = 0;
      for (const v of buckets) if (typeof v === 'number' && isFinite(v)) got++;
      return got / n;
    }

    function ENV_polarSvg(buckets, recent, opts) {
      const o = opts || {};
      const size = o.size || 260;
      const c = size / 2;
      const r = c - 24;
      const n = (buckets || []).length || 72;

      let maxKm = 0;
      for (const v of (buckets || [])) {
        if (typeof v === 'number' && isFinite(v) && v > maxKm) maxKm = v;
      }
      if (maxKm <= 0) return '';
      const sc = ENV_scaleFor(maxKm);

      // Bearing i is clockwise from north; SVG y grows downward, so north is
      // -y and east is +x.
      const pt = (i, km) => {
        const a = ((i + 0.5) * (360 / n) - 90) * Math.PI / 180;
        const rad = r * Math.max(0, Math.min(1, (km || 0) / sc.max));
        return [c + rad * Math.cos(a), c + rad * Math.sin(a)];
      };

      let grid = '';
      for (let k = 1; k <= sc.rings; k++) {
        const rr = (r * k) / sc.rings;
        grid += '<circle cx="' + c + '" cy="' + c + '" r="' + rr.toFixed(1) + '" fill="none" '
             +  'stroke="rgba(148,163,184,0.16)" stroke-width="1"/>';
        // Only the outermost ring is labelled: four numbers stacked up the
        // vertical made the middle of the plot busier than the data.
        if (k === sc.rings) {
          grid += '<text x="' + (c + 3) + '" y="' + (c - rr + 10).toFixed(1) + '" '
               +  'fill="#94a3b8" font-size="9" font-family="system-ui,sans-serif">'
               +  sc.max + ' km</text>';
        }
      }
      for (const d of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
        grid += '<line x1="' + c + '" y1="' + c + '" x2="' + (c + d[0] * r)
             +  '" y2="' + (c + d[1] * r) + '" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>';
      }
      const lbl = (t, x, y, anchor) =>
        '<text x="' + x + '" y="' + y + '" text-anchor="' + anchor + '" fill="#64748b" '
        + 'font-size="9" font-family="system-ui,sans-serif">' + t + '</text>';
      grid += lbl('N', c, 11, 'middle') + lbl('E', size - 3, c + 3, 'end')
           +  lbl('S', c, size - 2, 'middle') + lbl('W', 3, c + 3, 'start');

      const sparse = ENV_filledRatio(buckets) < 0.45;

      const spokes = (vals, color, width) => {
        let out = '';
        (vals || []).forEach((v, i) => {
          if (typeof v !== 'number' || !isFinite(v)) return;
          const p = pt(i, v);
          out += '<line x1="' + c + '" y1="' + c + '" x2="' + p[0].toFixed(1)
              +  '" y2="' + p[1].toFixed(1) + '" stroke="' + color + '" stroke-width="'
              +  width + '" stroke-linecap="round" opacity="0.85"/>';
        });
        return out;
      };
      const polygon = (vals, fill, stroke, dash) => {
        const pts = (vals || []).map((v, i) => {
          // Null pulls to the centre, so a blocked lobe is a bite out of the
          // shape rather than a smoothed-over curve.
          const km = (typeof v === 'number' && isFinite(v)) ? v : 0;
          const p = pt(i, km);
          return p[0].toFixed(1) + ',' + p[1].toFixed(1);
        }).join(' ');
        return '<polygon points="' + pts + '" fill="' + fill + '" stroke="' + stroke
             + '" stroke-width="1.5"' + (dash ? ' stroke-dasharray="4 3"' : '') + '/>';
      };

      let shapes;
      if (sparse) {
        shapes = spokes(buckets, '#c084fc', 2.5);
        if (ENV_hasData(recent)) shapes += spokes(recent, '#4ade80', 1.2);
      } else {
        shapes = polygon(buckets, 'rgba(192,132,252,0.16)', '#c084fc', false);
        if (ENV_hasData(recent)) shapes += polygon(recent, 'none', '#4ade80', true);
      }

      return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="'
           + size + '" role="img" aria-label="Coverage by bearing, to ' + sc.max + ' km">'
           + grid + shapes + '</svg>';
    }

    /** The plot's outer-ring value, so a caption can name the scale. */
    function ENV_scaleKm(buckets) {
      let m = 0;
      for (const v of (buckets || [])) {
        if (typeof v === 'number' && isFinite(v) && v > m) m = v;
      }
      return m > 0 ? ENV_scaleFor(m).max : 0;
    }

    /** True when at least one bearing has ever been heard on. */
    function ENV_hasData(buckets) {
      return Array.isArray(buckets) && buckets.some((v) => typeof v === 'number' && isFinite(v));
    }

    /** The coverage picture — which bearings this antenna actually hears, and
     *  how far. A gap in the fan is an obstruction; a short radius on one
     *  bearing is terrain.
     *
     *  The centre is deliberately rounded server-side to ~1 km and drawn as an
     *  area rather than a dot: it exists so a gap reads as a DIRECTION, and a
     *  crisp point would claim a precision the response does not carry. */
    async function loadAdsbCoverage() {
      const nodeId = _abNodeId;
      if (!nodeId) return;
      const note = document.getElementById('adsb-map-note');
      let d;
      try {
        const jwt = await getToken();
        const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/adsb-tracks?minutes=480`, {
          headers: { 'Authorization': 'Bearer ' + jwt },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        d = await res.json();
      } catch (e) {
        if (note) note.textContent = 'Could not load coverage — try again shortly.';
        return;
      }
      if (!d || _abNodeId !== nodeId || !document.getElementById('adsb-map')) return;

      if (!_abMap) {
        const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_29rl_1_764d57ded0436220d836abc9',
          { subdomains: 'abcd', maxZoom: 19, attribution: '© CartoDB' });
        // The wheel zooms. It was off because this map sits in a scrolling
        // panel and swallowing the wheel traps you at it — but the trap only
        // bites when the pointer is over the map, and a tracks map you cannot
        // zoom is not much of a tracks map. Leaflet re-enables page scrolling
        // the moment the pointer leaves, so the escape is just moving away.
        _abMap = L.map('adsb-map', {
          attributionControl: false, layers: [dark],
        }).setView([d.site ? d.site.lat : -33.8688, d.site ? d.site.lon : 151.2093], 8);
      }
      if (_abLayer) { _abLayer.remove(); _abLayer = null; }

      const layer = L.layerGroup();
      const traces = d.traces || [];
      // Remembered so "Recently heard" can be tinted to match, whichever of the
      // two responses arrives first.
      _abTrackColour = {};
      for (const tr of traces) {
        const colour = _abHexColour(tr.hex);
        _abTrackColour[String(tr.hex).toLowerCase()] = colour;
        // interactive, so the path answers a hover. The label is what the map
        // page shows: what it is called, and what it actually is.
        L.polyline(tr.points, { color: colour, weight: 1.4, opacity: 0.75 })
          .bindTooltip(_abTraceLabel(tr), { sticky: true, direction: 'top' })
          .addTo(layer);
      }
      _abPaintHeard();

      // Kept whether or not it is showing, so the toggle is instant and does
      // not need its own fetch.
      _abCoverageGeom = _abCoverageRing(d.site, d.coverage && d.coverage.buckets);
      const covBtn = document.getElementById('adsb-cov-btn');
      if (covBtn) covBtn.style.display = _abCoverageGeom ? '' : 'none';
      _abApplyCoverage();
      if (d.site) {
        const c = [d.site.lat, d.site.lon];
        L.circle(c, { radius: 1000, color: '#38bdf8', weight: 1, opacity: 0.5, fillColor: '#38bdf8', fillOpacity: 0.12, interactive: false }).addTo(layer);
        L.circleMarker(c, { radius: 4, color: '#f8fafc', weight: 1.5, fillColor: '#38bdf8', fillOpacity: 0.9 })
          .bindTooltip('Your receiver — approximate').addTo(layer);
      }
      layer.addTo(_abMap);
      _abLayer = layer;

      try {
        const b = L.latLngBounds([]);
        for (const tr of traces) for (const pt of tr.points) b.extend(pt);
        // Framed on the TRACKS, not the envelope. The envelope spans weeks
        // and would zoom this out until the last eight hours of traffic were
        // a few pixels across — which is the whole point of this map.
        if (d.site) b.extend([d.site.lat, d.site.lon]);
        if (b.isValid()) _abMap.fitBounds(b.pad(0.08));
      } catch (_e) { /* degenerate bounds is not worth failing the view for */ }
      setTimeout(() => _abMap && _abMap.invalidateSize(), 60);

      if (note) {
        note.textContent = !d.site
          ? 'Set your exact antenna pin under Location to anchor the picture.'
          : `${d.aircraft} aircraft · ${traces.length} with a path · `
            + `${Number(d.points).toLocaleString()} positions. Your receiver is drawn `
            + 'as an approximate area, not its exact pin.';
      }

      // Same response carries the envelope, so the plot is filled from here.
      const polar = document.getElementById('adsb-polar');
      if (polar) polar.innerHTML = _abPolarBody(d.coverage);
    }

    /** The polar coverage plot — how far this receiver hears on every bearing,
     *  accumulated across the retention window. Its own picture rather than an
     *  overlay on the track map: the two answer different questions, and the
     *  envelope's extent was squashing the tracks into a few pixels. */
    function _abPolarBody(cov) {
      if (!cov || !ENV_hasData(cov.buckets)) {
        return '<div class="ab-note">Nothing heard yet — a coverage picture needs '
             + 'traffic from enough directions to take shape.</div>';
      }
      const svg = ENV_polarSvg(cov.buckets, cov.recent, { size: 240 });
      const days = `${cov.daysCovered} ${cov.daysCovered === 1 ? 'day' : 'days'}`;
      let legend = `<div><span class="ab-polar-key" style="border-top-color:#c084fc;"></span>`
        + `All time · mapped to ${Math.round(cov.maxKm)} km</div>`;
      if (ENV_hasData(cov.recent)) {
        legend += `<div><span class="ab-polar-key" style="border-top-color:#4ade80;`
          + `border-top-style:dashed;"></span>Last 24 hours</div>`;
      }
      legend += `<div>Built from ${days}</div>`;
      if (cov.daysCovered < 2) {
        legend += `<div style="color:#fbbf24;">Too little history yet to judge this</div>`;
      }
      legend += `<div>Outer ring ${ENV_scaleKm(cov.buckets)} km</div>`;
      return `<div class="ab-polar-wrap">${svg}<div class="ab-polar-legend">${legend}</div></div>`;
    }

    function closeAdsbStats() {
      if (_abPoll) { clearInterval(_abPoll); _abPoll = null; }
      _abNodeId = null;
      // Tear the map down explicitly: removing its container via innerHTML
      // leaves Leaflet's listeners and tile requests alive.
      if (_abLayer) { _abLayer.remove(); _abLayer = null; }
      if (_abMap) { _abMap.remove(); _abMap = null; }
      const m = document.getElementById('adsb-modal'); if (m) m.remove();
    }

    // Create a node. A coarse area is REQUIRED (radio: RFS zone; pager: State +
    // LGA), so we collect it (plus an optional exact pin) in the picker FIRST —
    // the node is created on Save (see saveLocation), not before, so cancelling
    // creates nothing. Then continue to the installer.
    async function addNode(btn) {
      const kind = document.getElementById('new-node-kind').value;
      const orig = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> …'; }
      try {
        await openLocationPicker(null, { createKind: kind, thenInstall: true });
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = orig; }
      }
    }

    // Rotate a node's token (owner-scoped). Returns the new plaintext or null.
    async function rotateNodeToken(nodeId) {
      const jwt = await getToken();
      if (!jwt) return null;
      const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/rotate-token`, {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + jwt },
      });
      if (!res.ok) return null;
      const data = await res.json().catch(() => ({}));
      if (data.token) _nodeTokens[nodeId] = data.token;
      return data.token || null;
    }

    async function rotateNode(nodeId, btn) {
      if (!await confirmDialog({
        title: 'Re-issue node key?',
        message: 'The old installer/key stops working and the node must be re-installed with the new one.',
        confirmLabel: 'Re-issue key', danger: true,
      })) return;
      const original = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      try {
        const token = await rotateNodeToken(nodeId);
        if (!token) throw new Error('rotate failed');
        await refreshNodes();
        const node = (_feederNodes || []).find(n => n.id === nodeId) || { id: nodeId };
        showInstallModal(node);
      } catch (e) {
        showToast('Could not re-issue key.', 'error');
      } finally { btn.disabled = false; btn.innerHTML = original; }
    }

    async function deleteFeederNode(nodeId, btn) {
      if (!await confirmDialog({
        title: 'Delete this node?',
        message: 'It will be cut off and cannot reconnect.',
        confirmLabel: 'Delete node', danger: true,
      })) return;
      btn.disabled = true;
      try {
        const jwt = await getToken();
        const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}`, {
          method: 'DELETE', headers: { 'Authorization': 'Bearer ' + jwt },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        delete _nodeTokens[nodeId];
        showToast('Node deleted.', 'success');
        await refreshNodes();
      } catch (e) {
        showToast('Could not delete node.', 'error');
        btn.disabled = false;
      }
    }

    // Install prompt after create/rotate. The node key is baked into the
    // installer, so we deliberately DO NOT show it — nothing for the user to copy.
    function showInstallModal(node) {
      const existing = document.getElementById('token-modal');
      if (existing) existing.remove();
      const kind = node.kind || 'radio';
      const agentCfg = _kindAgent[kind];
      const _label = { windows: 'Windows installer', linux: 'Linux installer' };
      const _icon = { windows: 'fa-windows', linux: 'fa-linux' };
      const _file = (p) => `install-nswpsn-${kind}-node.${p === 'windows' ? 'ps1' : 'sh'}`;
      // Per-platform "how to run it" shown under each download button.
      const _runInstr = {
        linux: `Then run it: <code>sudo bash ${_file('linux')}</code>`,
        windows: `Then right-click <code>${_file('windows')}</code> → <b>Run with PowerShell</b> (it elevates).`,
      };
      const dlBlocks = agentCfg
        ? agentCfg.platforms.map((p) => `
            <div class="dl-block">
              <button class="dl-btn" onclick="downloadInstaller('${p}','${node.id}',this)"><i class="fab ${_icon[p]}"></i> ${_label[p]}</button>
              <div class="dl-run">${_runInstr[p]}</div>
            </div>`).join('')
        : `<span class="node-chip">agent coming soon for this type</span>`;
      const hint = kind === 'pager'
        ? `<p>Run it on your Linux box (Raspberry Pi or PC) with your RTL-SDR dongle(s) plugged in — it installs rtl-sdr + multimon-ng, auto-detects your SDRs and starts decoding. Your node's key is baked in, nothing to copy.</p>`
        : `<p>Download the installer and run it — your node's key is already baked in, nothing to copy.</p>`;
      const el = document.createElement('div');
      el.id = 'token-modal';
      el.className = 'modal-overlay';
      el.innerHTML = `
        <div class="modal">
          <h3><i class="fas fa-circle-check"></i> ${escapeHtml(node.name || 'Node')} ready</h3>
          ${hint}
          <div class="dl-list">${dlBlocks}</div>
          <div class="modal-actions">
            <button class="mini-btn" onclick="document.getElementById('token-modal').remove()">Close</button>
          </div>
        </div>`;
      document.body.appendChild(el);
    }

    // Location picker. What is required differs by kind:
    //   radio — NSW RFS zone, exact pin optional
    //   pager — State + LGA (the state routes its Pagermon feed AND selects
    //           its frequency plan), exact pin optional
    //   adsb  — the exact pin IS the location, and is REQUIRED. Not a
    //           preference: the decoder is launched with --lat/--lon and
    //           computes its range statistics from them, so an approximate
    //           position produces wrong numbers and a missing one produces
    //           none at all.
    // Used both to create a node (opts.createKind — created on Save) and to
    // edit an existing one.
    async function openLocationPicker(nodeId, opts) {
      closeLocationPicker(); // never stack two pickers
      opts = opts || {};
      _loc.nodeId = nodeId || null;
      _loc.thenInstall = !!opts.thenInstall;
      _loc.createKind = opts.createKind || null;
      _loc.node = opts.node || (_feederNodes || []).find(n => n.id === nodeId) || (nodeId ? { id: nodeId } : null);
      const node = _loc.node || {};
      const createMode = !!_loc.createKind;
      const hasPin = typeof node.lat === 'number' && typeof node.lon === 'number';
      const curZone = node.zone || '';
      const kind = _loc.createKind || node.kind;
      const isPager = kind === 'pager';
      const isAdsb = kind === 'adsb';
      if (!isPager && !isAdsb) {
        const zones = await loadZones();
        if (!zones.length) {
          // No zones = can't pick one = can't create/save. Don't open a dead modal.
          showToast('Could not load the region list. Check your connection and try again.', 'error');
          return;
        }
      }
      const overlay = document.createElement('div');
      overlay.id = 'loc-modal';
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal loc-modal">
          <h3><i class="fas fa-location-dot"></i> Node location</h3>
          <p>${isAdsb
            ? `Drop a pin on your <b>exact antenna position</b> — this one is required. Your receiver uses it to work out how far away each aircraft is, so its range and coverage figures are only as accurate as this pin. Street-level is what you want. The position is staff/owner only, never public.`
            : isPager
            ? `Every pager node needs its <b>state</b> and <b>council area (LGA)</b> — the state decides which Pagermon network it feeds and what frequencies it scans. Optionally drop an <b>exact antenna pin</b> for <b>coverage</b> estimates. The location is staff/owner only, never public.`
            : `Every node needs a <b>region</b> (its NSW RFS area). Optionally drop an <b>exact antenna pin</b> — it improves <b>coverage</b> estimates and <b>channel tuning</b>. The pin and region are staff/owner only, never public.`}</p>
          ${isAdsb ? `` : isPager ? `
          <label class="loc-field">
            <span>State <span style="color:#f87171">*</span></span>
            <select id="loc-state" onchange="_locOnStateChange()">${_stateOptionsHtml(node.state || '')}</select>
          </label>
          <label class="loc-field">
            <span>Council area (LGA) <span style="color:#f87171">*</span></span>
            <span class="lga-combo">
              <input id="loc-lga" value="${escapeHtml(node.lga || '')}" maxlength="120" autocomplete="off" placeholder="Select your state first…"
                oninput="_lgaShow()" onfocus="_lgaShow()" onblur="_lgaHide()">
              <div id="loc-lga-dd" class="lga-dd"></div>
            </span>
          </label>` : `
          <label class="loc-field">
            <span>Region <span style="color:#f87171">*</span></span>
            <select id="loc-zone">${_zoneOptionsHtml(curZone)}</select>
          </label>`}
          ${isAdsb ? `
          <div class="loc-pin-required">
            <span>Antenna position <span style="color:#f87171">*</span></span>
          </div>` : `
          <label class="loc-pin-toggle">
            <input type="checkbox" id="loc-pin-on" ${hasPin ? 'checked' : ''} onchange="_locTogglePin(this.checked)">
            <span>Set an exact antenna pin (optional)</span>
          </label>`}
          <div id="loc-map" style="display:${(hasPin || isAdsb) ? 'block' : 'none'};"></div>
          <div class="modal-actions">
            <button class="dl-btn" onclick="saveLocation(this)"><i class="fas fa-check"></i> ${createMode ? 'Create node' : 'Save'}</button>
            ${(!createMode && hasPin && !isAdsb) ? `<button class="mini-btn danger" onclick="clearLocation(this)">Remove pin</button>` : ''}
            <button class="mini-btn" onclick="skipLocation()">Cancel</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      if (hasPin) _locInitMap([node.lat, node.lon], true);
      // ADS-B: the map is the whole form, so bring it up straight away. Opens on
      // the country-wide default with pinPlaced=false, which is what makes Save
      // refuse until the volunteer actually clicks their own antenna — the
      // default marker must never be mistaken for a real position.
      else if (isAdsb) _locInitMap([-33.8688, 151.2093], false);
      // Pre-fill the LGA suggestions for the stored state (edit mode) and wire
      // the dropdown: pick on mousedown, which fires BEFORE the input's blur.
      if (isPager) {
        _locOnStateChange(true);
        const dd = document.getElementById('loc-lga-dd');
        if (dd) dd.addEventListener('mousedown', (e) => {
          const opt = e.target.closest('.lga-opt');
          if (!opt) return;
          e.preventDefault();
          const input = document.getElementById('loc-lga');
          if (input) input.value = opt.getAttribute('data-lga') || '';
          _lgaHide();
        });
      }
    }

    // Lazily build the Leaflet pin map (only when the pin section is shown, so a
    // hidden map never mis-sizes).
    function _locInitMap(center, zoomed) {
      if (_loc.map) { setTimeout(() => _loc.map.invalidateSize(), 40); return; }
      const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_29rl_1_764d57ded0436220d836abc9',
        { subdomains: 'abcd', maxZoom: 19, attribution: '© CartoDB' });
      const sat = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
        { subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], maxZoom: 21, maxNativeZoom: 19, attribution: '© Google' });
      const map = L.map('loc-map', { layers: [dark] }).setView(center, zoomed ? 14 : 10);
      L.control.layers({ 'Dark': dark, 'Satellite': sat }, {}, { position: 'topright' }).addTo(map);
      const marker = L.marker(center, { draggable: true }).addTo(map);
      // An EXISTING pin is already "placed"; a fresh default marker is NOT — so we
      // don't save the default Sydney coords unless the user actually moves/clicks it.
      _loc.pinPlaced = !!zoomed;
      marker.on('dragend', () => { _loc.pinPlaced = true; });
      map.on('click', (e) => { marker.setLatLng(e.latlng); _loc.pinPlaced = true; });
      _loc.map = map; _loc.marker = marker;
      setTimeout(() => map.invalidateSize(), 80);
    }

    // Toggle the optional exact-pin section.
    function _locTogglePin(on) {
      const mapEl = document.getElementById('loc-map');
      if (!mapEl) return;
      if (on) {
        mapEl.style.display = 'block';
        const node = _loc.node || {};
        const center = typeof node.lat === 'number' ? [node.lat, node.lon] : [-33.8688, 151.2093];
        _locInitMap(center, typeof node.lat === 'number');
      } else {
        mapEl.style.display = 'none';
        if (_loc.map) { _loc.map.remove(); _loc.map = null; _loc.marker = null; }
      }
    }

    // Cancel the picker. In create mode nothing was created yet, so this simply
    // aborts (no node); in edit mode it just closes.
    function skipLocation() { closeLocationPicker(); }

    function closeLocationPicker() {
      if (_loc.map) { _loc.map.remove(); _loc.map = null; _loc.marker = null; }
      const m = document.getElementById('loc-modal'); if (m) m.remove();
    }

    async function putLocation(nodeId, body) {
      const jwt = await getToken();
      const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/location`, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + jwt, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    }

    async function saveLocation(btn) {
      // Per-kind area fields: pager = state + lga, radio = RFS zone, adsb = the
      // exact pin and nothing else. `area` is spread into both the create body
      // and putLocation.
      const kind = _loc.createKind || (_loc.node && _loc.node.kind);
      const isPager = kind === 'pager';
      const isAdsb = kind === 'adsb';
      let area;
      if (isAdsb) {
        area = {};
      } else if (isPager) {
        const state = document.getElementById('loc-state')?.value || '';
        const lga = (document.getElementById('loc-lga')?.value || '').trim();
        if (!state) { showToast('Please select your state.', 'error'); return; }
        if (!lga) { showToast('Please enter your council area (LGA).', 'error'); return; }
        area = { state, lga };
      } else {
        const zoneSel = document.getElementById('loc-zone');
        const zone = zoneSel ? zoneSel.value : '';
        if (!zone) { showToast('Please select your region.', 'error'); return; }
        area = { zone };
      }
      const pinOn = document.getElementById('loc-pin-on');
      let lat = null, lon = null;
      if (isAdsb) {
        // The pin IS the location here, so there is no untick escape: without a
        // real position the decoder reports no range at all. Same
        // untouched-default guard as below — the marker starts on a placeholder
        // and pinPlaced only becomes true once the volunteer moves or clicks it.
        if (!_loc.marker || !_loc.pinPlaced) {
          showToast('Click or drag the pin to your exact antenna location — ADS-B nodes need it to measure range.', 'error');
          return;
        }
        const c = _loc.marker.getLatLng();
        lat = c.lat; lon = c.lng;
      } else if (pinOn && pinOn.checked) {
        // Guard against saving the untouched default marker (Sydney CBD) as a real
        // antenna location — require the user to actually place it, or untick the pin.
        if (!_loc.marker || !_loc.pinPlaced) {
          showToast('Click or drag the pin to your exact antenna location, or untick the exact-pin option.', 'error');
          return;
        }
        const c = _loc.marker.getLatLng();
        lat = c.lat; lon = c.lng;
      }
      const createMode = !!_loc.createKind;
      const thenInstall = _loc.thenInstall;
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
      try {
        if (createMode) {
          const jwt = await getToken();
          if (!jwt) { window.location.href = 'login?redirect=' + encodeURIComponent('/feeder'); return; }
          const res = await fetch(`${API_BASE_URL}/api/feeder/nodes`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + jwt, 'Content-Type': 'application/json' },
            // ADS-B carries its pin in the CREATE body: the backend requires it
            // there (no area to fall back on), and it means the first config
            // push already has --lat/--lon rather than waiting for a follow-up.
            body: JSON.stringify({ kind: _loc.createKind, ...area, ...(isAdsb ? { lat, lon } : {}) }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          _nodeTokens[data.node.id] = data.token;
          // ADS-B already sent its pin in the create body above; a follow-up
          // PUT would only trigger a second, identical config push.
          if (lat !== null && !isAdsb) await putLocation(data.node.id, { ...area, lat, lon });
          closeLocationPicker();
          await refreshNodes();
          showInstallModal(data.node);
        } else {
          const nodeId = _loc.nodeId;
          await putLocation(nodeId, { ...area, lat, lon });
          showToast('Location saved.', 'success');
          closeLocationPicker();
          await refreshNodes();
          if (thenInstall) showInstallModal(_loc.node || { id: nodeId });
        }
      } catch (e) {
        showToast(`Could not save: ${e.message}`, 'error');
        btn.disabled = false; btn.innerHTML = `<i class="fas fa-check"></i> ${createMode ? 'Create node' : 'Save'}`;
      }
    }

    // Remove just the exact pin, keeping the (required) coarse area.
    async function clearLocation(btn) {
      const n = _loc.node || {};
      let area;
      if (n.kind === 'pager') {
        const state = document.getElementById('loc-state')?.value || n.state || '';
        const lga = (document.getElementById('loc-lga')?.value || n.lga || '').trim();
        if (!state || !lga) { showToast('Select your state and council area first.', 'error'); return; }
        area = { state, lga };
      } else {
        const zoneSel = document.getElementById('loc-zone');
        const zone = zoneSel ? zoneSel.value : (n.zone || '');
        if (!zone) { showToast('Select a region first.', 'error'); return; }
        area = { zone };
      }
      btn.disabled = true;
      try {
        await putLocation(_loc.nodeId, { ...area, lat: null, lon: null });
        showToast('Pin removed.', 'success');
        closeLocationPicker();
        await refreshNodes();
      } catch (e) { showToast('Could not remove pin.', 'error'); btn.disabled = false; }
    }

    // Download a node's installer (POST, token in body). Uses the session token if
    // known; otherwise rotates to mint a fresh one first.
    async function downloadInstaller(platform, nodeId, btn) {
      // Used below to name the downloaded file by node kind.
      const n = (_feederNodes || []).find(x => x.id === nodeId);
      const original = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing…'; }
      try {
        const jwt = await getToken();
        if (!jwt) { window.location.href = 'login?redirect=' + encodeURIComponent('/feeder'); return; }
        // Downloading no longer touches the node's key. The installer carries a
        // single-use enrolment code that the agent trades for a token when it
        // RUNS, so a node already running keeps running and this needs no
        // warning — which is the whole point of the change. The key only moves
        // when an installer is actually executed on a machine.
        const res = await fetch(`${API_BASE_URL}/api/feeder/download/${platform}`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + jwt, 'Content-Type': 'application/json' },
          body: JSON.stringify({ nodeId }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const blob = await res.blob();

        // Prefer the server-provided filename (Content-Disposition), else a
        // sensible per-platform default that still names the node kind so a
        // radio vs pager installer is identifiable.
        const kind = (n && n.kind) || 'radio';
        let filename = `install-nswpsn-${kind}-node.${platform === 'windows' ? 'ps1' : 'sh'}`;
        const cd = res.headers.get('Content-Disposition') || '';
        const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
        if (m && m[1]) { try { filename = decodeURIComponent(m[1].trim()); } catch (e) { filename = m[1].trim(); } }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showToast('Installer downloaded.', 'success');
      } catch (e) {
        console.error('Download failed:', e);
        showToast(`Download failed: ${e.message}`, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = original; }
      }
    }

    // Copy the Linux install command to the clipboard (with a brief tick).
    function copyCmd(btn) {
      const el = document.getElementById('linux-cmd');
      const text = el ? el.textContent : 'sudo bash install-nswpsn-node.sh';
      const done = () => {
        if (!btn) return;
        const prev = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check" style="color:var(--success)"></i>';
        setTimeout(() => { btn.innerHTML = prev; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => showToast('Copy failed', 'error'));
      } else {
        try {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove(); done();
        } catch (e) { showToast('Copy failed', 'error'); }
      }
    }

    // Poll /api/feeder/me every 15s to keep node status fresh. We re-render
    // only the nodes region so download buttons don't flicker mid-click.
    function startPolling() {
      if (_pollTimer) return;
      _pollTimer = setInterval(refreshNodes, _pollIntervalMs);
    }
    function stopPolling() {
      if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
    }
    async function refreshNodes() {
      try {
        const token = await getToken();
        if (!token) { stopPolling(); return; }
        const res = await fetch(`${API_BASE_URL}/api/feeder/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) return; // transient — keep the last good render
        const data = await res.json();
        const region = document.getElementById('nodes-region');
        if (!region) return;
        const nodes = data.nodes || [];
        _feederNodes = nodes;
        region.innerHTML = nodes.length
          ? `<div class="node-list">${nodes.map(_nodeRow).join('')}</div>`
          : `<div class="empty-state">
               <i class="fas fa-satellite-dish"></i>
               <p>No nodes yet — add one above to get its installer.</p>
             </div>`;
      } catch (e) { /* keep last render on transient errors */ }
    }

    // Pause polling when the tab is hidden; resume on return.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopPolling();
      else if (document.getElementById('nodes-region')) { refreshNodes(); startPolling(); }
    });

    boot();
  </script>
</body>
</html>
