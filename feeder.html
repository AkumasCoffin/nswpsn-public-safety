  <style>
    /* Tokens mirror staff.html so the page looks native to the admin/site. */
    :root {
      --bg-dark: #060a15;
      --bg-card: #0e1728;
      --bg-card-2: #121e33;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #f1f5f9;
      --text-soft: #94a3b8;
      --brand: #f97316;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --accent-border: rgba(56, 189, 248, 0.35);
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(900px 480px at 85% -10%, rgba(56, 189, 248, 0.06), transparent 60%),
        radial-gradient(700px 420px at -10% 0%, rgba(249, 115, 22, 0.05), transparent 55%),
        var(--bg-dark);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
    }

    ::selection { background: rgba(56, 189, 248, 0.3); }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }

    /* Header — sticky glassy topbar (mirrors staff.html). */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin: 0 -2rem 1.75rem;
      padding: 1rem 2rem;
      background: rgba(6, 10, 21, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
    .header h1 span { color: var(--brand); }
    .header-actions { display: flex; gap: 0.6rem; align-items: center; flex-shrink: 0; }

    .btn {
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: rgba(148, 163, 184, 0.35); }
    .btn-danger { background: rgba(239, 68, 68, 0.13); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.26); color: #fca5a5; }

    /* Big platform download buttons. */
    .dl-row { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1.25rem 0 0.5rem; }
    .dl-btn {
      flex: 1 1 220px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 1.1rem 1.4rem;
      border-radius: 12px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: #bae6fd;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;

    .dl-btn i { font-size: 1.4rem; }
    .dl-btn:hover:not(:disabled) { background: rgba(56, 189, 248, 0.25); color: #e0f2fe; }

    .card-head h2 { font-size: 1.2rem; font-weight: 700; }

    .steps {
      display: flex; gap: 0.6rem; flex-wrap: wrap;
      margin: 1.1rem 0 0.4rem;
    }
    .step {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;

    .note {
      margin-top: 1rem;
      font-size: 0.82rem;

      background: rgba(245, 158, 11, 0.08);

      border-radius: 8px;
      padding: 0.7rem 0.9rem;

    .note i { color: var(--warning); margin-right: 0.35rem; }
    .note a { color: var(--accent); text-decoration: none; }
    .note a:hover { text-decoration: underline; }

    .token-line {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--text-soft);
      display: inline-flex; align-items: center; gap: 0.4rem;

    .token-line code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.15rem 0.5rem;
      border-radius: 5px;
      color: #7dd3fc;
    }

    /* Platform (Windows / Linux) download cards. */
    .plat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.35rem 0 0.5rem;
    }
    .plat {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.15rem 1.2rem 1.25rem;

    .plat-head { display: flex; align-items: baseline; gap: 0.55rem; }
    .plat-head i { font-size: 1.2rem; color: var(--accent); position: relative; top: 2px; }
    .plat-head h3 { font-size: 1.05rem; font-weight: 700; }
    .plat-head .plat-tag { margin-left: auto; font-size: 0.72rem; color: var(--text-soft); }
    .plat .dl-btn { width: 100%; margin: 1rem 0 0; }
    .plat ol {
      list-style: none;
      counter-reset: step;
      margin: 1rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .plat ol li {
      counter-increment: step;
      position: relative;
      padding-left: 2rem;
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-primary);
    }
    .plat ol li::before {
      content: counter(step);
      position: absolute;
      left: 0; top: 0.05rem;
      width: 1.4rem; height: 1.4rem;
      border-radius: 50%;
      background: var(--accent-soft);
      color: #7dd3fc;
      border: 1px solid var(--accent-border);
      font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .plat ol li b { color: var(--accent); font-weight: 600; }
    .cmd {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.5rem;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0.4rem 0.5rem 0.4rem 0.6rem;
    }
    .cmd code {
      flex: 1; min-width: 0;
      overflow-x: auto; white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; color: #7dd3fc;
    }
    .cmd button {
      flex-shrink: 0;
      background: transparent; border: none;
      color: var(--text-soft); cursor: pointer;
      font-size: 0.85rem; padding: 0.15rem 0.3rem; border-radius: 5px;
      transition: color 0.15s ease;
    }
    .cmd button:hover { color: var(--accent); }
    .plat .note { margin-top: 0.9rem; }

    /* Section header inside a card. */
    .section-h {
      display: flex; align-items: center; gap: 0.75rem;
      color: var(--text-soft);
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      margin: 1.75rem 0 1rem; font-weight: 600;
    }
    .section-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-subtle), transparent); }

    /* Node list rows. */
    .node-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .node-row {
      display: flex; align-items: flex-start; gap: 0.85rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.85rem 1rem;
    }
    .node-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-soft); opacity: 0.5; flex-shrink: 0; margin-top: 0.35rem; }
    .node-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(34, 197, 94, 0.55); opacity: 1; }
    .node-meta { flex: 1; min-width: 0; }
    .node-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-sub { color: var(--text-soft); font-size: 0.78rem; margin-top: 0.15rem; }
    .node-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.45rem; }
    .node-chip {
      font-size: 0.7rem; font-weight: 600; padding: 0.14rem 0.55rem; border-radius: 999px;
      border: 1px solid var(--border-subtle); color: var(--text-soft);
      background: rgba(255, 255, 255, 0.03); white-space: nowrap;
    }
    .node-chip.ok { color: #86efac; border-color: rgba(34, 197, 94, 0.45); background: rgba(34, 197, 94, 0.13); }
    .node-chip.warn { color: #fcd34d; border-color: rgba(234, 179, 8, 0.45); background: rgba(234, 179, 8, 0.13); }
    .node-chip.off { opacity: 0.6; }
    .node-chip.updating { color: #c084fc; border-color: rgba(168, 85, 247, 0.45); background: rgba(168, 85, 247, 0.14); }
    .node-dot.updating { background: #a855f7; box-shadow: 0 0 8px rgba(168, 85, 247, 0.6); opacity: 1; animation: nodePulse 1.2s ease-in-out infinite; }
    @keyframes nodePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .node-stat { font-size: 0.78rem; color: var(--text-soft); margin-top: 0.45rem; }
    .node-stat b { color: var(--text-primary); font-weight: 700; }
    /* Card header: name (+ kind) on the left, agent version chip on the right. */
    .node-head { display: flex; align-items: center; gap: 0.5rem; }
    .node-head .node-name { flex: 1; }
    .node-sub .st-on { color: #86efac; font-weight: 600; }
    .node-sub .st-off { color: var(--text-soft); font-weight: 600; }
    .node-sub .st-upd { color: #c084fc; font-weight: 600; }
    /* Location / key meta line — icon+label items, comfortably spaced + wrapping. */
    .node-loc { display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; margin-top: 0.3rem; font-size: 0.75rem; color: var(--text-soft); }
    .node-loc .nl-item { display: inline-flex; align-items: center; gap: 0.3rem; }
    .node-loc .nl-item i { opacity: 0.7; }
    .node-loc .nl-warn { color: #fbbf24; }
    .node-loc .nl-key code { background: rgba(255,255,255,0.06); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 0.02rem 0.32rem; font-size: 0.7rem; color: var(--text-soft); }
    /* Recent-messages modal (owner view of decoded pager pages). */
    .msg-modal { max-width: 700px; }
    .msg-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .msg-head h3 { margin: 0; }
    .msg-sub { font-size: 0.75rem; color: var(--text-soft); margin: 0.35rem 0 0.7rem; }
    .msg-list { max-height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 0.3rem; }
    .msg-row { display: grid; grid-template-columns: auto 1fr auto; gap: 0.6rem; align-items: baseline;
      padding: 0.42rem 0.6rem; border-radius: 8px; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-subtle); font-size: 0.82rem; }
    .msg-row.msg-filtered { opacity: 0.5; }
    .msg-time { color: var(--text-soft); font-size: 0.72rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .msg-body { min-width: 0; word-break: break-word; line-height: 1.4; }
    .msg-addr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #7dd3fc; }
    .msg-src { color: var(--text-soft); font-size: 0.72rem; white-space: nowrap; }
    .msg-badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
      color: #fcd34d; background: rgba(234,179,8,0.14); border: 1px solid rgba(234,179,8,0.4);
      padding: 0.02rem 0.32rem; border-radius: 4px; margin-right: 0.25rem; }
    .msg-empty { color: var(--text-soft); text-align: center; padding: 1.6rem 1rem; font-size: 0.85rem; }
    /* Add-node form */
    .add-node { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.25rem 0 0.5rem; }
    .add-node input, .add-node select {
      flex: 1; min-width: 160px; background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 0.55rem 0.7rem; font-family: inherit; font-size: 0.85rem;
    }
    .add-node .dl-btn { width: auto; margin: 0; white-space: nowrap; }
    .add-node-hint { font-size: 0.75rem; color: var(--text-soft); margin: 0 0 0.5rem; }
    /* Per-node bits */
    .node-kind {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: #7dd3fc; background: rgba(56,189,248,0.14); border: 1px solid rgba(56,189,248,0.35);
      padding: 0.05rem 0.4rem; border-radius: 5px; vertical-align: middle; margin-left: 0.35rem;
    }
    .node-sub code { color: var(--text-primary); }
    .node-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
    .mini-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); border-radius: 7px;
      color: var(--text-soft); padding: 0.32rem 0.55rem; font-size: 0.78rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .mini-btn:hover { color: var(--text-primary); border-color: var(--accent-border, #38bdf8); }
    .mini-btn.danger:hover { color: #fca5a5; border-color: rgba(239,68,68,0.5); }
    /* One-time token modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
      align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px;
      padding: 1.4rem; max-width: 520px; width: 100%; }
    .modal h3 { margin: 0 0 0.6rem; }
    .modal p { color: var(--text-soft); font-size: 0.85rem; margin: 0 0 0.8rem; }
    .modal h3 .req {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: #fcd34d; background: rgba(234,179,8,0.14); border: 1px solid rgba(234,179,8,0.4);
      padding: 0.08rem 0.4rem; border-radius: 5px; vertical-align: middle; margin-left: 0.4rem;
    }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .modal-actions .dl-btn { width: auto; margin: 0; }
    /* Per-platform download + its run instructions in the install modal. */
    .dl-list { display: flex; flex-direction: column; gap: 0.7rem; margin: 0.6rem 0 0.9rem; }
    .dl-block { display: flex; flex-direction: column; gap: 0.3rem; }
    /* Compact download buttons in the list (the base .dl-btn is a big CTA). */
    .dl-block .dl-btn { flex: 0 0 auto; width: auto; align-self: flex-start; margin: 0; padding: 0.45rem 0.85rem; font-size: 0.84rem; border-radius: 8px; gap: 0.5rem; }
    .dl-block .dl-btn i { font-size: 0.95rem; }
    .dl-run { font-size: 0.8rem; color: var(--text-soft); line-height: 1.5; }
    .dl-run code { background: rgba(255,255,255,0.06); border: 1px solid var(--border-subtle); border-radius: 5px; padding: 0.1rem 0.4rem; font-size: 0.76rem; color: var(--text-primary); user-select: all; }
    .dl-btn.danger { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.45); color: #fca5a5; }
    .dl-btn.danger:hover:not(:disabled) { background: rgba(239,68,68,0.25); color: #fecaca; }
    .loc-modal { max-width: 620px; }
    .loc-field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.9rem; }
    .loc-field > span { font-size: 0.85rem; font-weight: 600; color: var(--text-soft, #94a3b8); }
    /* Match the node-kind picker (.add-node select) so it fits the rest of the page. */
    .loc-field select {
      width: 100%; background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-subtle); border-radius: 8px;
      color: var(--text-primary); padding: 0.55rem 0.7rem; font-family: inherit; font-size: 0.9rem;
    }
    /* The native option popup ignores translucent/inherited colours on most
       browsers, so give the options + group labels a solid dark bg + light text
       (otherwise the zone names render unreadable). */
    .loc-field select option { background: #0f172a; color: var(--text-primary); }
    .loc-field select optgroup { background: #0f172a; color: #7dd3fc; font-weight: 700; }
    .loc-pin-toggle { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.9rem; font-size: 0.9rem; cursor: pointer; }
    .loc-pin-toggle input { width: 16px; height: 16px; flex: 0 0 auto; }
    #loc-map { height: 340px; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--border-subtle); }
    #loc-map, #loc-map * { box-sizing: initial; } /* Leaflet needs its own box model */
    .leaflet-container { background: #0b1220; }
    .node-ver {
      font-size: 0.72rem; color: #7dd3fc;
      background: var(--accent-soft);
      padding: 0.16rem 0.5rem; border-radius: 5px; white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--text-soft);
      background: var(--bg-card);
      border: 1px dashed var(--border-subtle);
      border-radius: 12px;
    }
    .empty-state i { font-size: 2.2rem; margin-bottom: 0.85rem; opacity: 0.4; display: block; }

    .loading { display: flex; align-items: center; justify-content: center; padding: 4rem; }
    .loading i { font-size: 1.8rem; color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toasts (mirrors staff.html). */
    #toast-stack {
      position: fixed; bottom: 1.25rem; right: 1.25rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      z-index: 3000; pointer-events: none;
    }
    .toast {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg-card-2);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: var(--text-primary);
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.6);
      max-width: 340px;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.success i { color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.error i { color: var(--danger); }
    .toast.fade-out { opacity: 0; transition: opacity 0.3s ease; }

    @media (max-width: 768px) {
      .container { padding: 1rem 1rem 2rem; }
      .header { margin: 0 -1rem 1.25rem; padding: 0.85rem 1rem; flex-wrap: wrap; }
      .card { padding: 1.2rem 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Radio <span>Feeder</span></h1>
      <div class="header-actions">
        <a href="map.html" class="btn btn-secondary"><i class="fas fa-map"></i> Map</a>
        <button class="btn btn-danger" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <!-- Feeder cards live in this container. Phase 1 ships the radio card;
         aircraft / pager feeder cards can be appended here later as their
         backend endpoints land — each is a self-contained .card. -->
    <div id="feeder-cards">
      <div class="loading"><i class="fas fa-spinner"></i></div>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let _pollTimer = null;
    const _pollIntervalMs = 15_000;

    function escapeHtml(value) {
      if (value == null) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, kind = 'success', ms = 3500) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle' };
      const el = document.createElement('div');
      el.className = `toast ${kind}`;
      el.innerHTML = `<i class="fas ${icons[kind] || icons.success}"></i><span></span>`;
      el.querySelector('span').textContent = message;
      stack.appendChild(el);
      setTimeout(() => { el.classList.add('fade-out'); setTimeout(() => el.remove(), 350); }, ms);
    }

    // In-page confirm dialog — replaces the browser's native confirm(). Returns
    // a Promise<boolean>. Pass a string or { title, message, confirmLabel,
    // cancelLabel, danger }.
    function confirmDialog(opts) {
      const o = typeof opts === 'string' ? { message: opts } : (opts || {});
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal">
            <h3><i class="fas ${o.danger ? 'fa-triangle-exclamation' : 'fa-circle-question'}"></i> ${escapeHtml(o.title || 'Please confirm')}</h3>
            <p></p>
            <div class="modal-actions">
              <button class="dl-btn ${o.danger ? 'danger' : ''}" data-act="ok"><i class="fas fa-check"></i> ${escapeHtml(o.confirmLabel || 'Confirm')}</button>
              <button class="mini-btn" data-act="cancel">${escapeHtml(o.cancelLabel || 'Cancel')}</button>
            </div>
          </div>`;
        overlay.querySelector('p').textContent = o.message || '';
        const done = (val) => { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(val); };
        const onKey = (e) => { if (e.key === 'Escape') done(false); else if (e.key === 'Enter') done(true); };
        overlay.addEventListener('click', (e) => { if (e.target === overlay) done(false); });
        overlay.querySelector('[data-act="ok"]').addEventListener('click', () => done(true));
        overlay.querySelector('[data-act="cancel"]').addEventListener('click', () => done(false));
        document.body.appendChild(overlay);
        document.addEventListener('keydown', onKey);
        setTimeout(() => { const b = overlay.querySelector('[data-act="ok"]'); if (b) b.focus(); }, 30);
      });
    }

    function fmtLastSeen(value) {
      if (value == null || value === '') return 'never';
      let d;
      if (typeof value === 'number') d = new Date(value < 1e12 ? value * 1000 : value);
      else {
        const n = Number(value);
        d = (!Number.isNaN(n) && String(value).trim() !== '')
          ? new Date(n < 1e12 ? n * 1000 : n)
          : new Date(value);
      }
      if (Number.isNaN(d.getTime())) return 'unknown';
      const secs = Math.round((Date.now() - d.getTime()) / 1000);
      if (secs < 0) return 'just now';
      if (secs < 60) return `${secs}s ago`;
      if (secs < 3600) return `${Math.round(secs / 60)}m ago`;
      if (secs < 86400) return `${Math.round(secs / 3600)}h ago`;
      return d.toLocaleDateString();
    }

    // Current Supabase access token — required as a Bearer for every
    // /api/feeder call (the endpoints gate on the JWT, not the API_KEY).
    async function getToken() {
      const { data } = await sb.auth.getSession();
      return data?.session?.access_token || null;
    }

    async function doLogout() {
      if (typeof umami !== 'undefined') umami.track('logout');
      await sb.auth.signOut();
      window.location.href = 'login.html';
    }

    // --- Boot: require a session, else bounce to the login page (keeping a
    // ?redirect= back here, exactly like the rest of the site). ---
    async function boot() {
      const { data } = await sb.auth.getSession();
      if (!data.session) {
        window.location.href = 'login.html?redirect=' + encodeURIComponent('/feeder.html');
        return;
      }
      await loadFeeder();
    }

    async function loadFeeder() {
      const container = document.getElementById('feeder-cards');
      try {
        const token = await getToken();
        if (!token) {
          window.location.href = 'login.html?redirect=' + encodeURIComponent('/feeder.html');
          return;
        }
        const res = await fetch(`${API_BASE_URL}/api/feeder/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 403) { stopPolling(); renderNotContributor(); return; }
        if (res.status === 503) { stopPolling(); renderNotConfigured(); return; }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        renderRadioCard(data);
        startPolling();
      } catch (e) {
        console.error('Error loading feeder:', e);
        stopPolling();
        if (container) container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-triangle-exclamation"></i>
            <p>Couldn't load your feeder details.<br><span style="font-size:0.8rem;">${escapeHtml(e.message)}</span></p>
            <button class="btn btn-secondary" style="margin-top:1rem;" onclick="loadFeeder()"><i class="fas fa-sync-alt"></i> Retry</button>
          </div>`;
      }
    }

    function renderNotContributor() {
      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon" style="background: rgba(148,163,184,0.14); color: var(--text-soft);"><i class="fas fa-lock"></i></div>
            <h2>You're not set up as a radio feeder yet</h2>
          </div>
          <p class="card-sub">
            Radio feeding is invite-based. If you'd like to run a feeder node and contribute
            scanner audio, request access below and a staff member will set you up.
          </p>
          <div class="dl-row">
            <a class="dl-btn" href="signup.html" style="text-decoration:none;">
              <i class="fas fa-user-plus"></i> Request feeder access
            </a>
          </div>
          <p class="card-sub" style="margin-top:0.75rem;">
            Already asked? It may still be pending — or reach out to staff on
            <a href="https://discord.forcequit.xyz" target="_blank" style="color:var(--accent);text-decoration:none;">Discord</a>.
          </p>
        </div>`;
    }

    function renderNotConfigured() {
      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon" style="background: rgba(245,158,11,0.14); color: var(--warning);"><i class="fas fa-screwdriver-wrench"></i></div>
            <h2>Feeder system not configured yet</h2>
          </div>
          <p class="card-sub">The radio feeder backend isn't switched on for this deployment yet — check back soon.</p>
        </div>`;
    }

    // Plaintext node tokens are shown ONCE and never stored server-side; keep the
    // ones minted this session in memory so a fresh install can be downloaded
    // right after create/rotate. Lost on reload → re-download rotates for a new key.
    const _nodeTokens = {};
    let _feederNodes = [];
    const _kindLabel = { radio: 'PSN', pager: 'Pager', adsb: 'ADSB' };
    // Kinds with a real agent + installer today, and the platforms each supports.
    const _kindAgent = {
      radio: { platforms: ['windows', 'linux'] },
      pager: { platforms: ['linux'] }, // rtl_fm | multimon-ng is a Linux stack
    };
    const hasAgent = (kind) => !!_kindAgent[kind];
    const _loc = { map: null, marker: null, thenInstall: false, node: null, nodeId: null, createKind: null, pinPlaced: false };

    // RFS zone list (grouped by Area Command) for the location picker dropdown.
    let _zoneGroups = null;
    async function loadZones() {
      if (_zoneGroups) return _zoneGroups;
      try {
        const jwt = await getToken();
        const res = await fetch(`${API_BASE_URL}/api/feeder/zones`, {
          headers: jwt ? { 'Authorization': 'Bearer ' + jwt } : {},
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const groups = Array.isArray(data.groups) ? data.groups : [];
        // Only CACHE a non-empty list so a transient failure retries on the next
        // open instead of sticking the picker with an empty dropdown.
        if (groups.length) _zoneGroups = groups;
        return groups;
      } catch (e) { return []; }
    }
    function _zoneOptionsHtml(selected) {
      let out = `<option value="" ${selected ? '' : 'selected'} disabled>Select your region…</option>`;
      for (const g of (_zoneGroups || [])) {
        out += `<optgroup label="${escapeHtml(g.areaCommand)}">`;
        for (const z of (g.zones || [])) {
          out += `<option value="${escapeHtml(z.name)}" ${z.name === selected ? 'selected' : ''}>${escapeHtml(z.name)}</option>`;
        }
        out += `</optgroup>`;
      }
      return out;
    }

    function renderRadioCard(data) {
      const nodes = data.nodes || [];
      _feederNodes = nodes;
      // Which node kinds this user may create (by role). Default permissive if an
      // older backend doesn't send it. adsb needs radio_contributor (roleForKind).
      const cc = data.canCreate || { radio: true, pager: true };
      const opts = [];
      if (cc.radio) opts.push('<option value="radio">PSN</option>');
      if (cc.pager) opts.push('<option value="pager">Pager</option>');
      if (cc.radio) opts.push('<option value="adsb">ADSB — coming soon</option>');
      const addNodeHtml = opts.length
        ? `<div class="add-node">
             <select id="new-node-kind" aria-label="Node type">${opts.join('')}</select>
             <button class="dl-btn" onclick="addNode(this)"><i class="fas fa-plus"></i> Add node</button>
           </div>
           <p class="add-node-hint">Nodes are named automatically. Pick a type and add.</p>`
        : `<p class="add-node-hint">Your account doesn't have a contributor role that can create nodes.</p>`;
      const nodesHtml = nodes.length
        ? `<div class="node-list">${nodes.map(_nodeRow).join('')}</div>`
        : `<div class="empty-state">
             <i class="fas fa-satellite-dish"></i>
             <p>No nodes yet — add one below to get its installer.</p>
           </div>`;

      document.getElementById('feeder-cards').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="icon"><i class="fas fa-satellite-dish"></i></div>
            <h2>Your feeder nodes</h2>
          </div>
          <p class="card-sub">
            Each node has its own key. Add a node, download its installer (key baked in), and run it.
            Deleting or re-issuing a node's key cuts off just that one node — nothing else.
          </p>

          ${addNodeHtml}

          <div class="section-h">Nodes</div>
          <div id="nodes-region">${nodesHtml}</div>
        </div>`;
    }

    function _nodeRow(node) {
      const online = !!node.online;
      const updating = !!node.updating;
      const name = node.name || 'Unnamed node';
      const lastSeen = fmtLastSeen(node.lastSeenAt);
      const kind = node.kind || 'radio';
      const isRadio = kind === 'radio';
      const isPager = kind === 'pager';
      const agentCfg = _kindAgent[kind];
      const agent = node.agentVersion;
      const agentHtml = agent ? `<span class="node-ver">agent ${escapeHtml(agent)}</span>` : '';
      // Pager: which frequencies are decoding right now (RFS / FR / both).
      const freqShort = (l) => { const u = String(l).toUpperCase(); return (u === 'NSWRFS' || u === 'RFS') ? 'RFS' : (u === 'FRNSW' || u === 'FR') ? 'FR' : l; };
      const decodedLabels = Array.isArray(node.pagerDecoding) ? node.pagerDecoding.map(freqShort) : [];

      const chip = (cls, label) => `<span class="node-chip ${cls}">${escapeHtml(label)}</span>`;
      const chipHtml = (cls, html) => `<span class="node-chip ${cls}">${html}</span>`;
      let chips;
      if (!agentCfg) {
        chips = chip('', 'agent coming soon');
      } else if (updating) {
        chips = chipHtml('updating', '<i class="fas fa-arrows-rotate"></i> Updating');
      } else if (!online) {
        chips = chip('off', 'Offline');
      } else if (isPager) {
        let out = '';
        if (!node.sdrUp) out += chip('warn', 'No readers');
        else if (node.decoding) out += chip('ok', 'Decoding ' + (decodedLabels.length ? decodedLabels.join(' + ') : 'POCSAG'));
        else out += chip('', 'Idle');
        if (node.feedEnabled === false) out += chip('off', 'Feed off');
        else if (node.uploading) out += chip('ok', 'Uploading');
        else out += chip('', 'Feed on');
        chips = out;
      } else {
        let out = '';
        if (!node.sdrUp) out += chip('warn', 'Receiver down');
        else if (node.decoding) out += chip('ok', 'Decoding');
        else out += chip('', 'Idle');
        if (node.feedEnabled === false) out += chip('off', 'Feed off');
        else if (node.uploading) out += chip('ok', 'Uploading');
        else out += chip('', 'Feed on');
        if (node.calibrated === false) out += chip('warn', 'Not calibrated');
        if (node.jmbeInstalled === false) out += chip('warn', 'No JMBE audio');
        chips = out;
      }

      let statHtml = '';
      if (online && agentCfg) {
        const parts = [];
        if (isPager) {
          const msgs = Number(node.messagesLast10m ?? node.callsLast10m ?? 0);
          parts.push(`<b>${msgs}</b> message${msgs === 1 ? '' : 's'} · last 10 min`);
          if (typeof node.readersUp === 'number') parts.push(`<b>${node.readersUp}</b> reader${node.readersUp === 1 ? '' : 's'} running`);
        } else {
          const calls = Number(node.callsLast10m || 0);
          parts.push(`<b>${calls}</b> call${calls === 1 ? '' : 's'} uploaded · last 10 min`);
        }
        if (typeof node.queueDepth === 'number' && node.queueDepth > 0) {
          parts.push(`<b>${node.queueDepth}</b> queued`);
        }
        statHtml = `<div class="node-stat">${parts.join(' &nbsp;·&nbsp; ')}</div>`;
      }

      const located = typeof node.lat === 'number' && typeof node.lon === 'number';
      const statusText = updating ? 'Updating…' : (online ? 'Online' : 'Offline');
      const statusCls = updating ? 'st-upd' : (online ? 'st-on' : 'st-off');
      const regionItem = node.zone
        ? `<span class="nl-item"><i class="fas fa-map"></i> ${escapeHtml(node.zone)}</span>`
        : `<span class="nl-item nl-warn"><i class="fas fa-map"></i> no region set</span>`;
      const pinItem = located ? `<span class="nl-item"><i class="fas fa-location-dot"></i> exact pin</span>` : '';
      const keyItem = node.tokenPrefix ? `<span class="nl-item nl-key">key <code>${escapeHtml(node.tokenPrefix)}…</code></span>` : '';
      const _dlBtn = {
        windows: `<button class="mini-btn" title="Download Windows installer" onclick="downloadInstaller('windows','${node.id}',this)"><i class="fab fa-windows"></i> Windows</button>`,
        linux: `<button class="mini-btn" title="Download Linux installer" onclick="downloadInstaller('linux','${node.id}',this)"><i class="fab fa-linux"></i> Linux</button>`,
      };
      const dl = agentCfg ? agentCfg.platforms.map((p) => _dlBtn[p]).join('\n           ') : '';
      // Owners can view their pager node's recent decoded pages (rolling).
      const msgsBtn = isPager
        ? `<button class="mini-btn" title="Show recent decoded pages" onclick="showNodeMessages('${node.id}')"><i class="fas fa-envelope"></i> Messages</button>`
        : '';
      const actions = `
        <div class="node-actions">
          ${msgsBtn}
          ${dl}
          <button class="mini-btn" title="Set region / exact pin" onclick="openLocationPicker('${node.id}')"><i class="fas fa-location-dot"></i> ${node.zone ? 'Location' : 'Set region'}</button>
          <button class="mini-btn" title="Re-issue key (invalidates the old installer)" onclick="rotateNode('${node.id}',this)"><i class="fas fa-key"></i></button>
          <button class="mini-btn danger" title="Delete node (cuts it off)" onclick="deleteFeederNode('${node.id}',this)"><i class="fas fa-trash"></i></button>
        </div>`;

      return `
        <div class="node-row">
          <span class="node-dot ${updating ? 'updating' : (online ? 'online' : '')}" title="${statusText}"></span>
          <div class="node-meta">
            <div class="node-head">
              <div class="node-name">${escapeHtml(name)} <span class="node-kind">${escapeHtml(_kindLabel[kind] || kind)}</span></div>
              ${agentHtml}
            </div>
            <div class="node-sub"><span class="${statusCls}">${statusText}</span> · last seen ${escapeHtml(lastSeen)}</div>
            <div class="node-loc">${regionItem}${pinItem}${keyItem}</div>
            <div class="node-chips">${chips}</div>
            ${statHtml}
            ${actions}
          </div>
        </div>`;
    }

    // Owner view of a pager node's recent decoded pages (the rolling buffer the
    // backend keeps, same data staff see in the drawer). Polls every 5s while open.
    let _msgPoll = null;
    async function showNodeMessages(nodeId) {
      closeNodeMessages();
      const overlay = document.createElement('div');
      overlay.id = 'msg-modal';
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal msg-modal">
          <div class="msg-head">
            <h3><i class="fas fa-envelope-open-text"></i> Recent messages</h3>
            <button class="mini-btn" onclick="closeNodeMessages()">Close</button>
          </div>
          <div class="msg-sub" id="msg-sub">loading…</div>
          <div id="msg-list" class="msg-list"></div>
        </div>`;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeNodeMessages(); });
      document.body.appendChild(overlay);
      const load = async () => {
        try {
          const jwt = await getToken();
          const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/messages`, {
            headers: { 'Authorization': 'Bearer ' + jwt },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (document.getElementById('msg-modal')) _renderNodeMessages(data.messages || []);
        } catch (e) {
          const sub = document.getElementById('msg-sub');
          if (sub) sub.textContent = 'Could not load messages — try again shortly.';
        }
      };
      await load();
      _msgPoll = setInterval(load, 5000);
    }
    function _renderNodeMessages(msgs) {
      const list = document.getElementById('msg-list');
      const sub = document.getElementById('msg-sub');
      if (!list) return;
      const filteredN = msgs.filter(m => m.filtered).length;
      if (sub) sub.textContent = msgs.length
        ? `newest first · ${msgs.length} buffered${filteredN ? ` · ${filteredN} filtered (dimmed)` : ''}`
        : 'No messages decoded yet.';
      if (!msgs.length) {
        list.innerHTML = `<div class="msg-empty">Decoded pages will appear here as they come in.</div>`;
        return;
      }
      list.innerHTML = msgs.slice().reverse().map(m => {
        const at = m.at != null ? new Date(m.at) : null;
        const time = at && !Number.isNaN(at.getTime()) ? at.toLocaleTimeString() : '—';
        const filt = m.filtered ? ' msg-filtered' : '';
        const badge = m.filtered ? `<span class="msg-badge" title="Not forwarded (${escapeHtml(m.filtered)})">filtered</span>` : '';
        return `<div class="msg-row${filt}">
          <span class="msg-time">${escapeHtml(time)}</span>
          <span class="msg-body">${badge}<span class="msg-addr">${escapeHtml(m.address || '')}</span> ${escapeHtml(m.message || '')}</span>
          <span class="msg-src">${escapeHtml(m.source || '')}</span>
        </div>`;
      }).join('');
    }
    function closeNodeMessages() {
      if (_msgPoll) { clearInterval(_msgPoll); _msgPoll = null; }
      const m = document.getElementById('msg-modal'); if (m) m.remove();
    }

    // Create a node. A zone is REQUIRED, so we collect it (plus an optional exact
    // pin) in the picker FIRST — the node is created on Save (see saveLocation),
    // not before, so cancelling creates nothing. Then continue to the installer.
    async function addNode(btn) {
      const kind = document.getElementById('new-node-kind').value;
      const orig = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> …'; }
      try {
        await openLocationPicker(null, { createKind: kind, thenInstall: true });
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = orig; }
      }
    }

    // Rotate a node's token (owner-scoped). Returns the new plaintext or null.
    async function rotateNodeToken(nodeId) {
      const jwt = await getToken();
      if (!jwt) return null;
      const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/rotate-token`, {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + jwt },
      });
      if (!res.ok) return null;
      const data = await res.json().catch(() => ({}));
      if (data.token) _nodeTokens[nodeId] = data.token;
      return data.token || null;
    }

    async function rotateNode(nodeId, btn) {
      if (!await confirmDialog({
        title: 'Re-issue node key?',
        message: 'The old installer/key stops working and the node must be re-installed with the new one.',
        confirmLabel: 'Re-issue key', danger: true,
      })) return;
      const original = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      try {
        const token = await rotateNodeToken(nodeId);
        if (!token) throw new Error('rotate failed');
        await refreshNodes();
        const node = (_feederNodes || []).find(n => n.id === nodeId) || { id: nodeId };
        showInstallModal(node);
      } catch (e) {
        showToast('Could not re-issue key.', 'error');
      } finally { btn.disabled = false; btn.innerHTML = original; }
    }

    async function deleteFeederNode(nodeId, btn) {
      if (!await confirmDialog({
        title: 'Delete this node?',
        message: 'It will be cut off and cannot reconnect.',
        confirmLabel: 'Delete node', danger: true,
      })) return;
      btn.disabled = true;
      try {
        const jwt = await getToken();
        const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}`, {
          method: 'DELETE', headers: { 'Authorization': 'Bearer ' + jwt },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        delete _nodeTokens[nodeId];
        showToast('Node deleted.', 'success');
        await refreshNodes();
      } catch (e) {
        showToast('Could not delete node.', 'error');
        btn.disabled = false;
      }
    }

    // Install prompt after create/rotate. The node key is baked into the
    // installer, so we deliberately DO NOT show it — nothing for the user to copy.
    function showInstallModal(node) {
      const existing = document.getElementById('token-modal');
      if (existing) existing.remove();
      const kind = node.kind || 'radio';
      const agentCfg = _kindAgent[kind];
      const _label = { windows: 'Windows installer', linux: 'Linux installer' };
      const _icon = { windows: 'fa-windows', linux: 'fa-linux' };
      const _file = (p) => `install-nswpsn-${kind}-node.${p === 'windows' ? 'ps1' : 'sh'}`;
      // Per-platform "how to run it" shown under each download button.
      const _runInstr = {
        linux: `Then run it: <code>sudo bash ${_file('linux')}</code>`,
        windows: `Then right-click <code>${_file('windows')}</code> → <b>Run with PowerShell</b> (it elevates).`,
      };
      const dlBlocks = agentCfg
        ? agentCfg.platforms.map((p) => `
            <div class="dl-block">
              <button class="dl-btn" onclick="downloadInstaller('${p}','${node.id}',this)"><i class="fab ${_icon[p]}"></i> ${_label[p]}</button>
              <div class="dl-run">${_runInstr[p]}</div>
            </div>`).join('')
        : `<span class="node-chip">agent coming soon for this type</span>`;
      const hint = kind === 'pager'
        ? `<p>Run it on your Linux box (Raspberry Pi or PC) with your RTL-SDR dongle(s) plugged in — it installs rtl-sdr + multimon-ng, auto-detects your SDRs and starts decoding. Your node's key is baked in, nothing to copy.</p>`
        : `<p>Download the installer and run it — your node's key is already baked in, nothing to copy.</p>`;
      const el = document.createElement('div');
      el.id = 'token-modal';
      el.className = 'modal-overlay';
      el.innerHTML = `
        <div class="modal">
          <h3><i class="fas fa-circle-check"></i> ${escapeHtml(node.name || 'Node')} ready</h3>
          ${hint}
          <div class="dl-list">${dlBlocks}</div>
          <div class="modal-actions">
            <button class="mini-btn" onclick="document.getElementById('token-modal').remove()">Close</button>
          </div>
        </div>`;
      document.body.appendChild(el);
    }

    // Location picker: a REQUIRED RFS zone (coarse area) + an OPTIONAL exact
    // antenna pin (for coverage + channel tuning). Used both to create a node
    // (opts.createKind — node is created on Save) and to edit an existing one.
    async function openLocationPicker(nodeId, opts) {
      closeLocationPicker(); // never stack two pickers
      opts = opts || {};
      _loc.nodeId = nodeId || null;
      _loc.thenInstall = !!opts.thenInstall;
      _loc.createKind = opts.createKind || null;
      _loc.node = opts.node || (_feederNodes || []).find(n => n.id === nodeId) || (nodeId ? { id: nodeId } : null);
      const node = _loc.node || {};
      const createMode = !!_loc.createKind;
      const hasPin = typeof node.lat === 'number' && typeof node.lon === 'number';
      const curZone = node.zone || '';
      const zones = await loadZones();
      if (!zones.length) {
        // No zones = can't pick one = can't create/save. Don't open a dead modal.
        showToast('Could not load the region list. Check your connection and try again.', 'error');
        return;
      }
      const overlay = document.createElement('div');
      overlay.id = 'loc-modal';
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal loc-modal">
          <h3><i class="fas fa-location-dot"></i> Node location</h3>
          <p>Every node needs a <b>region</b> (its NSW RFS area). Optionally drop an
             <b>exact antenna pin</b> — it improves <b>coverage</b> estimates and
             <b>channel tuning</b>. The pin and region are staff/owner only, never public.</p>
          <label class="loc-field">
            <span>Region <span style="color:#f87171">*</span></span>
            <select id="loc-zone">${_zoneOptionsHtml(curZone)}</select>
          </label>
          <label class="loc-pin-toggle">
            <input type="checkbox" id="loc-pin-on" ${hasPin ? 'checked' : ''} onchange="_locTogglePin(this.checked)">
            <span>Set an exact antenna pin (optional)</span>
          </label>
          <div id="loc-map" style="display:${hasPin ? 'block' : 'none'};"></div>
          <div class="modal-actions">
            <button class="dl-btn" onclick="saveLocation(this)"><i class="fas fa-check"></i> ${createMode ? 'Create node' : 'Save'}</button>
            ${(!createMode && hasPin) ? `<button class="mini-btn danger" onclick="clearLocation(this)">Remove pin</button>` : ''}
            <button class="mini-btn" onclick="skipLocation()">Cancel</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      if (hasPin) _locInitMap([node.lat, node.lon], true);
    }

    // Lazily build the Leaflet pin map (only when the pin section is shown, so a
    // hidden map never mis-sizes).
    function _locInitMap(center, zoomed) {
      if (_loc.map) { setTimeout(() => _loc.map.invalidateSize(), 40); return; }
      const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        { subdomains: 'abcd', maxZoom: 19, attribution: '© CartoDB' });
      const sat = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
        { subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], maxZoom: 21, maxNativeZoom: 19, attribution: '© Google' });
      const map = L.map('loc-map', { layers: [dark] }).setView(center, zoomed ? 14 : 10);
      L.control.layers({ 'Dark': dark, 'Satellite': sat }, {}, { position: 'topright' }).addTo(map);
      const marker = L.marker(center, { draggable: true }).addTo(map);
      // An EXISTING pin is already "placed"; a fresh default marker is NOT — so we
      // don't save the default Sydney coords unless the user actually moves/clicks it.
      _loc.pinPlaced = !!zoomed;
      marker.on('dragend', () => { _loc.pinPlaced = true; });
      map.on('click', (e) => { marker.setLatLng(e.latlng); _loc.pinPlaced = true; });
      _loc.map = map; _loc.marker = marker;
      setTimeout(() => map.invalidateSize(), 80);
    }

    // Toggle the optional exact-pin section.
    function _locTogglePin(on) {
      const mapEl = document.getElementById('loc-map');
      if (!mapEl) return;
      if (on) {
        mapEl.style.display = 'block';
        const node = _loc.node || {};
        const center = typeof node.lat === 'number' ? [node.lat, node.lon] : [-33.8688, 151.2093];
        _locInitMap(center, typeof node.lat === 'number');
      } else {
        mapEl.style.display = 'none';
        if (_loc.map) { _loc.map.remove(); _loc.map = null; _loc.marker = null; }
      }
    }

    // Cancel the picker. In create mode nothing was created yet, so this simply
    // aborts (no node); in edit mode it just closes.
    function skipLocation() { closeLocationPicker(); }

    function closeLocationPicker() {
      if (_loc.map) { _loc.map.remove(); _loc.map = null; _loc.marker = null; }
      const m = document.getElementById('loc-modal'); if (m) m.remove();
    }

    async function putLocation(nodeId, body) {
      const jwt = await getToken();
      const res = await fetch(`${API_BASE_URL}/api/feeder/nodes/${nodeId}/location`, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + jwt, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    }

    async function saveLocation(btn) {
      const zoneSel = document.getElementById('loc-zone');
      const zone = zoneSel ? zoneSel.value : '';
      if (!zone) { showToast('Please select your region.', 'error'); return; }
      const pinOn = document.getElementById('loc-pin-on');
      let lat = null, lon = null;
      if (pinOn && pinOn.checked) {
        // Guard against saving the untouched default marker (Sydney CBD) as a real
        // antenna location — require the user to actually place it, or untick the pin.
        if (!_loc.marker || !_loc.pinPlaced) {
          showToast('Click or drag the pin to your exact antenna location, or untick the exact-pin option.', 'error');
          return;
        }
        const c = _loc.marker.getLatLng();
        lat = c.lat; lon = c.lng;
      }
      const createMode = !!_loc.createKind;
      const thenInstall = _loc.thenInstall;
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
      try {
        if (createMode) {
          const jwt = await getToken();
          if (!jwt) { window.location.href = 'login.html?redirect=' + encodeURIComponent('/feeder.html'); return; }
          const res = await fetch(`${API_BASE_URL}/api/feeder/nodes`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + jwt, 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind: _loc.createKind, zone }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          _nodeTokens[data.node.id] = data.token;
          if (lat !== null) await putLocation(data.node.id, { zone, lat, lon });
          closeLocationPicker();
          await refreshNodes();
          showInstallModal(data.node);
        } else {
          const nodeId = _loc.nodeId;
          await putLocation(nodeId, { zone, lat, lon });
          showToast('Location saved.', 'success');
          closeLocationPicker();
          await refreshNodes();
          if (thenInstall) showInstallModal(_loc.node || { id: nodeId });
        }
      } catch (e) {
        showToast(`Could not save: ${e.message}`, 'error');
        btn.disabled = false; btn.innerHTML = `<i class="fas fa-check"></i> ${createMode ? 'Create node' : 'Save'}`;
      }
    }

    // Remove just the exact pin, keeping the (required) zone.
    async function clearLocation(btn) {
      const zoneSel = document.getElementById('loc-zone');
      const zone = zoneSel ? zoneSel.value : ((_loc.node && _loc.node.zone) || '');
      if (!zone) { showToast('Select a region first.', 'error'); return; }
      btn.disabled = true;
      try {
        await putLocation(_loc.nodeId, { zone, lat: null, lon: null });
        showToast('Pin removed.', 'success');
        closeLocationPicker();
        await refreshNodes();
      } catch (e) { showToast('Could not remove pin.', 'error'); btn.disabled = false; }
    }

    // Download a node's installer (POST, token in body). Uses the session token if
    // known; otherwise rotates to mint a fresh one first.
    async function downloadInstaller(platform, nodeId, btn) {
      // Location is optional — no gate here. (n used for the never-connected check below.)
      const n = (_feederNodes || []).find(x => x.id === nodeId);
      const original = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing…'; }
      try {
        const jwt = await getToken();
        if (!jwt) { window.location.href = 'login.html?redirect=' + encodeURIComponent('/feeder.html'); return; }
        let token = _nodeTokens[nodeId];
        if (!token) {
          // The key is shown once (hash-only at rest) and kept only in memory,
          // so after a reload we must issue a fresh one. If the node has never
          // connected there's no working installer to break — do it silently.
          // Only warn once a machine has actually bound/run this node.
          const everConnected = !!(n && (n.installId || n.lastSeenAt));
          if (everConnected && !await confirmDialog({
            title: 'Issue a new key?',
            message: 'This issues a NEW key for the node. The current installer stops working and the node must be re-installed with the new one.',
            confirmLabel: 'Issue new key', danger: true,
          })) return;
          token = await rotateNodeToken(nodeId);
          if (!token) throw new Error('could not get a node key');
          await refreshNodes();
        }
        const res = await fetch(`${API_BASE_URL}/api/feeder/download/${platform}`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + jwt, 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const blob = await res.blob();

        // Prefer the server-provided filename (Content-Disposition), else a
        // sensible per-platform default that still names the node kind so a
        // radio vs pager installer is identifiable.
        const kind = (n && n.kind) || 'radio';
        let filename = `install-nswpsn-${kind}-node.${platform === 'windows' ? 'ps1' : 'sh'}`;
        const cd = res.headers.get('Content-Disposition') || '';
        const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
        if (m && m[1]) { try { filename = decodeURIComponent(m[1].trim()); } catch (e) { filename = m[1].trim(); } }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showToast('Installer downloaded.', 'success');
      } catch (e) {
        console.error('Download failed:', e);
        showToast(`Download failed: ${e.message}`, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = original; }
      }
    }

    // Copy the Linux install command to the clipboard (with a brief tick).
    function copyCmd(btn) {
      const el = document.getElementById('linux-cmd');
      const text = el ? el.textContent : 'sudo bash install-nswpsn-node.sh';
      const done = () => {
        if (!btn) return;
        const prev = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check" style="color:var(--success)"></i>';
        setTimeout(() => { btn.innerHTML = prev; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => showToast('Copy failed', 'error'));
      } else {
        try {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove(); done();
        } catch (e) { showToast('Copy failed', 'error'); }
      }
    }

    // Poll /api/feeder/me every 15s to keep node status fresh. We re-render
    // only the nodes region so download buttons don't flicker mid-click.
    function startPolling() {
      if (_pollTimer) return;
      _pollTimer = setInterval(refreshNodes, _pollIntervalMs);
    }
    function stopPolling() {
      if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
    }
    async function refreshNodes() {
      try {
        const token = await getToken();
        if (!token) { stopPolling(); return; }
        const res = await fetch(`${API_BASE_URL}/api/feeder/me`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) return; // transient — keep the last good render
        const data = await res.json();
        const region = document.getElementById('nodes-region');
        if (!region) return;
        const nodes = data.nodes || [];
        _feederNodes = nodes;
        region.innerHTML = nodes.length
          ? `<div class="node-list">${nodes.map(_nodeRow).join('')}</div>`
          : `<div class="empty-state">
               <i class="fas fa-satellite-dish"></i>
               <p>No nodes yet — add one above to get its installer.</p>
             </div>`;
      } catch (e) { /* keep last render on transient errors */ }
    }

    // Pause polling when the tab is hidden; resume on return.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopPolling();
      else if (document.getElementById('nodes-region')) { refreshNodes(); startPolling(); }
    });

    boot();
  </script>
</body>
</html>
