# nodeagent (ADS-B) configuration.
#
# The real file is generated by the installer with your token already baked in
# — download it from the Feeder page rather than copying this by hand. This
# exists to document what the fields mean.
#
# Installed location: /etc/nswpsn-node/agent.yaml (0640, owned by nswpsn-node)

# Backend base URL. MUST be https: the agent self-updates over this channel, so
# a plaintext URL would let anyone on the path serve a malicious binary and its
# matching hash. The agent refuses to start otherwise (loopback excepted, for
# development).
server_url: "https://api.forcequit.xyz"

# WebSocket URL. Derived from server_url when blank — leave it blank.
ws_url: ""

# This node's own token, shown once when the node is created. Not a shared key:
# it identifies this node specifically, and can be rotated from the Feeder page
# if it leaks.
node_token: ""

# Machine identity. Leave empty on a fresh install — the agent generates a UUID
# on first run and writes it back here. The backend binds it to the node on
# first connect (trust-on-first-use) and rejects a different machine using the
# same token afterwards, so DO NOT copy a filled-in file to a second host.
install_id: ""

# Node type. Must be "adsb" for this agent; the backend warns on a mismatch
# with how the node was created.
kind: "adsb"

# Working directory: upload queue, component logs, and the generated decoder
# script.
data_dir: "/var/lib/nswpsn-node"

# Where dump1090 writes aircraft.json / stats.json and the agent reads them.
#
# Defaults to a systemd RuntimeDirectory, which is tmpfs — deliberately. The
# decoder rewrites these files once a second; on real storage that is ~86k
# writes a day, which wears out an SD card on a Pi within months.
json_dir: "/run/nswpsn-adsb"

# The decoder executable, resolved via PATH when bare. dump1090-fa is preferred
# (the installer sets it up); dump1090-mutability speaks the same --write-json
# contract and works as a fallback.
#
# Note the installer also masks any dump1090 systemd service the package ships:
# those auto-start and would claim the dongle before this agent's supervised
# child could open it.
dump1090_bin: "dump1090-fa"

# Gain and antenna position are NOT set here. They come from the backend config
# push, so staff can retune a receiver without touching the host:
#   - gain "auto" (recommended) runs the agent's adaptive gain loop, which
#     walks the gain to suit this site's antenna, feedline and RF neighbours.
#     It is NOT the dongle's hardware AGC, which decodes 1090 poorly.
#   - the antenna position comes from the map pin set when the node was
#     created. Without it the decoder reports no range statistics at all.
