# pager-node agent configuration (example)
#
# Copy this file to "agent.yaml" (next to the nodeagent-pager executable, or point
# at it with --config <path>) and fill in your values. Fields left empty fall back
# to the documented defaults; install_id and ws_url are auto-filled on first run.

# Backend relay + REST base URL (https). Buffered pager messages are POSTed to
# ${server_url}/api/node-ingest/pager-upload.
server_url: "https://api.forcequit.xyz"

# Control WebSocket base URL (wss). If empty, it is derived from server_url
# (http->ws, https->wss) and written back on first run.
ws_url: "wss://api.forcequit.xyz"

# The feeder token issued to this node (starts with "npsn_").
node_token: "npsn_replace_me"

# Stable per-install identifier. Leave empty on first run — a UUIDv4 is
# generated and persisted back into this file automatically.
install_id: ""

# Node type. Defaults to "pager"; leave as-is for a pager feeder node.
kind: "pager"

# Base directory for the disk queue, reader scripts, child-process logs, and
# agent state. Created if missing. Subdirs: <data_dir>/queue, <data_dir>/logs,
# <data_dir>/readers.
data_dir: "./data"

# Address the localhost pager listener binds to. MUST be a loopback address —
# the reader.sh scripts POST decoded lines to http://<relay_addr>/pager.
relay_addr: "127.0.0.1:17390"
